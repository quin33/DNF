<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏服务统一控制台</title>
  <link rel="stylesheet" href="/control-panel.css">
  <style>
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr));
      gap: 1.5rem;
      margin-block: 1.5rem;
    }
    .game-block {
      background: var(--surface-2, #0F131C);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 12px;
      padding: 1.25rem;
    }
    .game-block[data-available="false"] { opacity: 0.55; }
    .game-block > header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .game-block h2 { font-size: 1.15rem; margin: 0; }
    .game-block .where {
      font-size: 0.8rem;
      color: var(--text-secondary, #9CA3AF);
      font-family: 'Consolas', 'Monaco', monospace;
    }
    .game-block .status-grid { grid-template-columns: 1fr; gap: 1rem; }
    .unified-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="kicker">本机运维台</p>
        <h1>游戏服务统一控制台</h1>
      </div>
      <div class="topbar-meta">
        <span class="local-badge">仅本机访问</span>
        <span id="last-updated">等待连接</span>
      </div>
    </header>

    <main id="app" class="app" hidden>
      <section class="overview">
        <div class="section-heading">
          <div>
            <h2>批量操作</h2>
            <p>同时控制两个游戏的网页服务。</p>
          </div>
          <button id="refresh" class="button button-quiet" type="button">刷新状态</button>
        </div>
        <div class="unified-actions">
          <button class="button" data-batch-action="start" type="button">启动全部</button>
          <button class="button" data-batch-action="restart" type="button">重启全部</button>
          <button class="button button-danger" data-batch-action="stop" type="button">停止全部</button>
        </div>
      </section>

      <section class="game-block" id="gateway-block" data-available="true" aria-labelledby="gateway-title">
        <header>
          <h2 id="gateway-title">站点网关</h2>
          <span class="where" data-field="gw-root">—</span>
        </header>
        <div class="status-grid">
          <article class="status-panel" data-tone="server">
            <div class="panel-topline">
              <span class="status-dot" data-field="gw-dot"></span>
              <span data-field="gw-state">检查中</span>
            </div>
            <h3>路径分发</h3>
            <dl class="facts">
              <div><dt>进程</dt><dd data-field="gw-pid">—</dd></div>
              <div><dt>端口</dt><dd data-field="gw-port">—</dd></div>
              <div><dt>健康检查</dt><dd data-field="gw-health">—</dd></div>
              <div><dt>上游路由</dt><dd data-field="gw-sites">—</dd></div>
            </dl>
            <div class="actions">
              <button class="button" data-gw-action="start" type="button">启动网关</button>
              <button class="button" data-gw-action="restart" type="button">重启网关</button>
              <button class="button button-danger" data-gw-action="stop" type="button">停止网关</button>
            </div>
          </article>
        </div>
      </section>

      <div id="game-grid" class="game-grid"></div>

      <section class="logs-section" aria-labelledby="logs-title">
        <div class="section-heading">
          <div>
            <h2 id="logs-title">运行日志</h2>
            <p>日志已自动脱敏，仅保留最近记录。</p>
          </div>
          <div class="filters" role="group" aria-label="日志筛选">
            <label>来源<select id="log-game"><option value="all">全部</option></select></label>
            <label>级别<select id="log-level">
              <option value="all">全部</option>
              <option value="info">信息</option>
              <option value="warn">警告</option>
              <option value="error">错误</option>
            </select></label>
          </div>
        </div>
        <div id="log-list" class="log-list" aria-live="polite"><div class="empty-state">等待日志…</div></div>
      </section>
    </main>
  </div>

  <div id="login-panel" class="login-panel" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <form id="login-form" class="login-card">
      <p class="kicker">统一控制台</p>
      <h2 id="login-title">验证管理员身份</h2>
      <p>控制台只接受来自本机的请求。</p>
      <label for="password">控制台密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button button-primary" type="submit">进入控制台</button>
      <div id="login-error" class="form-error" role="alert"></div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/unified-control-ui.js" defer></script>
</body>
</html>
