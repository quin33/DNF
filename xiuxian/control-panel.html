<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>问道仙坊 · 本机服务控制台</title>
  <link rel="stylesheet" href="/control-panel.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="kicker">本机运维台</p>
        <h1>服务控制台</h1>
      </div>
      <div class="topbar-meta">
        <span class="local-badge">仅本机访问</span>
        <span id="last-updated">等待连接</span>
      </div>
    </header>

    <main id="app" class="app" hidden>
      <section class="overview" aria-labelledby="overview-title">
        <div class="section-heading">
          <div>
            <h2 id="overview-title">服务器状态</h2>
            <p>网页服务与远程 AI 接口的当前状态。</p>
          </div>
          <button id="refresh" class="button button-quiet" type="button">刷新状态</button>
        </div>
        <div class="status-grid">
          <article class="status-panel" data-tone="server">
            <div class="panel-topline"><span class="status-dot" id="server-dot"></span><span id="server-state">检查中</span></div>
            <h3>网页服务器</h3>
            <dl class="facts">
              <div><dt>进程</dt><dd id="server-pid">—</dd></div>
              <div><dt>端口</dt><dd id="server-port">—</dd></div>
              <div><dt>健康检查</dt><dd id="server-health">—</dd></div>
            </dl>
            <div class="actions">
              <button class="button" data-server-action="start" type="button">启动服务器</button>
              <button class="button" data-server-action="restart" type="button">重启服务器</button>
              <button class="button button-danger" data-server-action="stop" type="button">停止服务器</button>
            </div>
          </article>

          <article class="status-panel" data-tone="ai">
            <div class="panel-topline"><span class="status-dot" id="ai-dot"></span><span id="ai-state">检查中</span></div>
            <h3>AI 服务</h3>
            <dl class="facts">
              <div><dt>运行开关</dt><dd><label class="switch"><input id="ai-toggle" type="checkbox"><span class="switch-track"></span><span id="ai-toggle-label">—</span></label></dd></div>
              <div><dt>模型</dt><dd id="ai-model">—</dd></div>
              <div><dt>配置</dt><dd id="ai-configured">—</dd></div>
            </dl>
            <div class="actions">
              <button id="ai-reload" class="button" type="button">重载配置</button>
              <button id="ai-check" class="button button-quiet" type="button">检查连接</button>
            </div>
          </article>
        </div>
      </section>

      <section class="logs-section" aria-labelledby="logs-title">
        <div class="section-heading">
          <div>
            <h2 id="logs-title">运行日志</h2>
            <p>日志已自动脱敏，仅保留最近记录。</p>
          </div>
          <div class="filters" role="group" aria-label="日志筛选">
            <label>服务<select id="log-service"><option value="all">全部</option><option value="control">控制台</option><option value="server">网页服务</option></select></label>
            <label>级别<select id="log-level"><option value="all">全部</option><option value="info">信息</option><option value="warn">警告</option><option value="error">错误</option></select></label>
          </div>
        </div>
        <div id="log-list" class="log-list" aria-live="polite"><div class="empty-state">等待日志…</div></div>
      </section>
    </main>
  </div>

  <div id="login-panel" class="login-panel" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <form id="login-form" class="login-card">
      <p class="kicker">本机服务控制台</p>
      <h2 id="login-title">验证管理员身份</h2>
      <p>控制台只接受来自本机的请求。</p>
      <label for="password">控制台密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button button-primary" type="submit">进入控制台</button>
      <div id="login-error" class="form-error" role="alert"></div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/control-panel-ui.js" defer></script>
</body>
</html>
