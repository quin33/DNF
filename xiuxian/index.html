<script>
/* 经站点网关时页面在 /xiuxian/ 下，而代码里的 /api/... 是绝对路径，会打到站点根目录。
   这里统一包装 fetch 补上前缀。直接跑在 8787 上时 basePath 为空，行为不变。 */
(() => {
  const basePath = location.pathname.replace(/[^/]*$/, "").replace(/\/$/, "");
  window.__basePath = basePath;
  if (!basePath) return;
  const origin = window.fetch.bind(window);
  window.fetch = (input, init) => {
    if (typeof input === "string" && input.startsWith("/") && !input.startsWith("//")) {
      return origin(basePath + input, init);
    }
    return origin(input, init);
  };
})();
</script>
<script src="data.js"></script>
<script src="ai-companions.js"></script>
<script src="loot-settlement.js"></script>
<script>
/* ============================================================
   深渊酒馆 S1 · 独立复刻版
   模块：酒馆大厅 / 活动 / 建筑 / 我的 / 冒险者 / 小队 / 探险日志
   数据来源：data.js 中的 window.TAVERN_DATA（可自由替换）
   ============================================================ */
const D = window.TAVERN_DATA;

/* ---------- 工具 ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const advIdArg = id => (Number.isFinite(Number(id)) && String(Number(id)) === String(id)) ? String(Number(id)) : JSON.stringify(String(id));
function findAdvById(id) {
  const numeric = Number(id);
  const byId = (D.adventurers || []).find(a => Number(a.id) === numeric || String(a.id) === String(id));
  if (byId) return byId;
  const byDbId = (D.adventurers || []).find(a => Number(a._char_db_id) === numeric);
  if (byDbId) return byDbId;
  const npc = window.__npcCardCache && window.__npcCardCache.get(String(id));
  if (npc) return npc;
  const npcByName = window.__npcCardCache && Array.from(window.__npcCardCache.values()).find(card => card.id === id);
  return npcByName || null;
}
const fmtTime = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const fmtTimeFull = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const statusText = s => ({resting:'休息', idle:'空闲', in_party:'组队中', adventuring:'探险中', cultivating:'修炼中', breaking_through:'突破中', insighting:'参悟中', in_tavern:'酒馆活动中', working:'工作中', dead:'已阵亡', in_tavern_activity:'酒馆活动中'}[s] || s || '未知');
const rarityColor = r => ({common:'#8b949e', rare:'#58a6ff', epic:'#a371f7', legendary:'#f0883e', mythic:'#f85149'}[r] || '#8b949e');
function toastMsg(text) {
  const t = document.createElement('div');
  t.className = 'toast-ok';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
const accentFor = adv => {
  // 卡片颜色优先表达当前状态，便于在列表中快速扫读。
  if (adv.status === 'resting') return '#7c4dce';
  if (adv.status === 'cultivating' || adv.status === 'working' || adv.status === 'breaking_through') return '#20b88a';
  if (adv.status === 'insighting') return '#8b6fd1';
  if (adv.status === 'adventuring') return '#f08a24';
  if (adv.is_mine) return '#e6a817';
  if (adv.level >= 10) return '#f0883e';
  if (adv.level >= 5) return '#58a6ff';
  return '#5d87b3';
};

/* ---------- UI 风格切换（默认白色仙侠风，可切深色） ---------- */
function applyTheme(t) {
  document.body.dataset.theme = t;
  const btn = $('#theme-toggle');
  if (btn) btn.textContent = t === 'light' ? '🌙' : '☀️';
  localStorage.setItem('xiuxian_theme', t);
}
function toggleTheme() {
  applyTheme(document.body.dataset.theme === 'light' ? 'dark' : 'light');
}
applyTheme(localStorage.getItem('xiuxian_theme') || 'light');

/* ---------- 渲染主框架 ---------- */
const root = $('#app-root');
const T = D.tavern;
const FEATURED_BUILDING_CODES = new Set(['training_intelligence', 'spirit_platform', 'taixu_realm', 'forge', 'mailbox']);

root.innerHTML = `
  <!-- 页头 -->
  <header class="advs1-header">
    <div class="advs1-sigil">⚔️</div>
    <div class="advs1-header-copy">
      <span class="advs1-kicker">${esc(T.title_kicker)}</span>
      <h1 class="advs1-title">${esc(T.title)} <em>${esc(T.title_badge)}</em></h1>
      <p class="advs1-subtitle">${esc(T.subtitle)}</p>
    </div>
    <div class="advs1-beacon"><span></span></div>
  </header>

  <!-- 测试提示 -->
  <div class="advs1-beta-notice">
    <span class="beta-notice-icon">⚠️</span>
    <div class="beta-notice-body">
      <strong>抢先体验 · 测试版本</strong>
      <p>${esc(T.beta_notice)}</p>
    </div>
  </div>

  <!-- 公告 -->
  <div class="notice-banner">
    <div class="notice-banner-body">
      <strong>📢 酒馆公告</strong>
      <p class="notice-banner-text">${esc(T.notice)}</p>
    </div>
  </div>

  <!-- 标签页 -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="tavern"><span class="tab-btn-label">🍺 酒馆</span></button>
    <button class="tab-btn" data-tab="activity"><span class="tab-btn-label">🏆 活动</span></button>
    <button class="tab-btn" data-tab="building"><span class="tab-btn-label">🏗️ 建筑</span><span class="tab-task-count">${FEATURED_BUILDING_CODES.size}</span></button>
    <button class="tab-btn" data-tab="mine"><span class="tab-btn-label">👤 我的</span></button>
    <button class="tab-btn" data-tab="adventurers"><span class="tab-btn-label">⚔️ 冒险者</span></button>
    <button class="tab-btn" data-tab="party"><span class="tab-btn-label">🛡️ 小队</span></button>
    <button class="tab-btn" data-tab="logs"><span class="tab-btn-label">📜 探险日志</span></button>
  </nav>

  <section class="tab-content active" id="tab-tavern"></section>
  <section class="tab-content" id="tab-activity"></section>
  <section class="tab-content" id="tab-building"></section>
  <section class="tab-content" id="tab-mine"></section>
  <section class="tab-content" id="tab-adventurers"></section>
  <section class="tab-content" id="tab-party"></section>
  <section class="tab-content" id="tab-logs"></section>
`;

/* ============================================================
   冒险者卡片
   ============================================================ */
function normalizeAdvCardData(raw) {
  const adv = raw || {};
  return {
    ...adv,
    id: adv.id ?? adv._char_db_id ?? adv.charId ?? '',
    hp: Number.isFinite(Number(adv.hp)) ? Number(adv.hp) : 0,
    max_hp: Number.isFinite(Number(adv.max_hp)) && Number(adv.max_hp) > 0 ? Number(adv.max_hp) : 100,
    stamina: Number.isFinite(Number(adv.stamina)) ? Number(adv.stamina) : 0,
    max_stamina: Number.isFinite(Number(adv.max_stamina)) && Number(adv.max_stamina) > 0 ? Number(adv.max_stamina) : 100,
    strength: Number(adv.strength || 0), agility: Number(adv.agility || 0),
    intelligence: Number(adv.intelligence || 0), luck: Number(adv.luck || 0),
    traits: Array.isArray(adv.traits) ? adv.traits : [],
    equipment: Array.isArray(adv.equipment) ? adv.equipment : [],
    bag: Array.isArray(adv.bag) ? adv.bag : [],
    skills: Array.isArray(adv.skills) ? adv.skills : [],
  };
}
function advCardHTML(adv) {
  adv = normalizeAdvCardData(adv);
  const accent = accentFor(adv);
  const hpPct = adv.max_hp ? Math.max(0, adv.hp / adv.max_hp * 100) : 0;
  const stPct = adv.max_stamina ? Math.max(0, adv.stamina / adv.max_stamina * 100) : 0;
  // 修为进度：练气阶段为等级 × 100，筑基阶段为等级 × 200
  const lv = adv.level || 1;
  const expNeed = lv < 10 ? lv * 100 : lv < 14 ? lv * 200 : 2800;
  const expCap = lv === 10 || lv >= 14;
  const expCur = expCap ? Math.min(expNeed, adv.exp || 0) : (adv.exp || 0);
  const expPct = expNeed ? Math.min(100, Math.max(0, expCur / expNeed * 100)) : 0;
  const expLabel = expCap && expCur >= expNeed ? '圆满' : `${expCur}/${expNeed}`;
  const status = statusText(adv.status);
  const statusClass = ` status-${String(adv.status || 'unknown').replace(/[^a-z_]/g, '')}`;
  const frame = adv.title_frame ? ` title-frame--${adv.title_frame}` : '';
  const mine = adv.is_mine ? ' mine' : '';
  const dead = adv.status === 'dead' ? ' dead' : '';
  let traits = (adv.traits || []).slice(0, 4);
  if (adv.injury && adv.injury.name && !traits.includes(adv.injury.name)) traits = [adv.injury.name, ...traits].slice(0, 4);
  const equips = (adv.equipment || []).slice(0, 4);
  return `
  <div class="adv-card${frame}${mine}${dead}${statusClass}" style="--adv-accent:${accent}" data-adv-id="${adv.id}" onclick="openAdvDetail(${advIdArg(adv.id)})">
    <div class="adv-card-head">
      <div class="adv-name-wrap">
        <span class="adv-name">${esc(adv.name)}</span>
      </div>
      <span class="adv-status">${esc(status)}</span>
    </div>
    <div class="adv-hp"><div class="adv-hp-fill" style="width:${hpPct}%"></div><span class="adv-hp-text">${adv.hp}/${adv.max_hp}</span></div>
    <div class="adv-stamina"><div class="adv-stamina-fill" style="width:${stPct}%"></div><span class="adv-stamina-text">${adv.stamina}/${adv.max_stamina}</span></div>
    <div class="adv-cultivate" title="当前修为：${esc(adv.character_class || '练气一层')}"><div class="adv-cultivate-fill" style="width:${expPct}%"></div><span class="adv-cultivate-text">⛩️ 修为 ${esc(adv.character_class || '练气一层')} · ${expLabel}</span></div>
    <div class="adv-row">
      <span class="lv">${esc(adv.character_class || '练气一层')}</span>
      <span>体魄 ${adv.strength}</span>
      <span>身法 ${adv.agility}</span>
      <span>神识 ${adv.intelligence}</span>
      <span>气运 ${adv.luck}</span>
    </div>
    <div class="adv-row secondary">
      <span>${esc((adv.traits && adv.traits[0]) || '无灵根')}</span>
      <span>${esc(adv.personality || '')}</span>
      <span>💰 ${Number(adv.gold || 0).toFixed(0)} 灵石</span>
    </div>
    ${traits.length ? `<div class="adv-tags">${traits.map(t => `<span class="tag-badge${adv.injury && adv.injury.name === t ? ' injury-tag' : ''}">${esc(t)}${adv.injury && adv.injury.name === t ? `<span class="injury-cd" data-expires="${adv.injury.expiresAt}"></span>` : ''}</span>`).join('')}${(adv.traits||[]).length > 4 ? `<span class="tag-badge empty">+${(adv.traits||[]).length - 4}</span>` : ''}</div>` : ''}
    ${(adv.skills && adv.skills.length) ? `<div class="adv-tags">${adv.skills.slice(0, 4).map(s => `<span class="skill-badge st-${s.type === '功法' ? 'gongfa' : 'shufa'}" style="color:${skillTierColor(s)};border-color:${skillTierColor(s)}66">${esc(s.name)}<em class="sb-tier">${skillTier(s)}</em></span>`).join('')}${adv.skills.length > 4 ? `<span class="equip-badge empty">+${adv.skills.length - 4}</span>` : ''}</div>` : ''}
    <div class="adv-tags">
      ${adv.is_mine && (adv.bag && adv.bag.length) ? `<span class="equip-badge">🎒 储物袋 ${adv.bag.length}/100</span>` : ''}
      ${equips.map(e => `<span class="equip-badge" style="color:${itemColor(e)};border-color:${itemColor(e)}55">${esc(e.name)}${e.qty > 1 ? ` ×${e.qty}` : ''}</span>`).join('')}
      ${(adv.equipment||[]).length > 4 ? `<span class="equip-badge empty">+${(adv.equipment||[]).length - 4}</span>` : ''}
    </div>
    <div class="adv-foot">
      ${adv.is_mine ? '<span class="badge-mine">我的</span>' : ''}
      ${adv.latest_score ? `<span class="badge-score">${Number(adv.latest_score).toFixed(1)}</span>` : ''}
      ${adv.praise_count ? `<span class="badge-praise">${adv.praise_count}赞</span>` : ''}
      <button class="history-btn" onclick="event.stopPropagation();openAdvLogsModal(${advIdArg(adv.id)})">探险</button>
      ${adv.is_mine ? '' : `<button class="follow-btn ${adv.is_followed ? 'active' : ''}" onclick="event.stopPropagation();toggleFollow(this, ${advIdArg(adv.id)})">${adv.is_followed ? '已关注' : '☆ 关注'}</button>`}
    </div>
  </div>`;
}

/* ============================================================
   酒馆大厅
   ============================================================ */
function renderTavern() {
  const el = $('#tab-tavern');
  const seats = D.seats || [];
  const bar = seats.filter(s => s.zone === 'bar');
  const tables = seats.filter(s => s.zone !== 'bar');
  const tablesByLabel = {};
  tables.forEach(s => {
    const key = s.table_label || s.label || '其{he}桌';
    (tablesByLabel[key] = tablesByLabel[key] || []).push(s);
  });
  const chatCol = `
    <div class="chat-col">
      <div class="chat-title-bar"><h3 class="col-title">💬 酒馆闲聊</h3></div>
      <div class="chat-messages" id="chat-messages">
        ${D.chat.slice().reverse().map(m => `
          <div class="chat-msg">
            <div class="chat-msg-head">
              <span class="chat-nick">${m.title ? `<span class="chat-title">[${esc(m.title)}]</span>` : ''}${esc(m.nickname)}</span>
              <span class="chat-time">${fmtTime(m.time)}</span>
            </div>
            <p class="chat-content">${esc(m.content)}</p>
          </div>`).join('')}
      </div>
      <div class="chat-input-area">
        <textarea class="chat-input" rows="2" maxlength="300" placeholder="说点什么…" id="chat-input"></textarea>
        <div class="chat-input-foot">
          <span class="char-count"><span id="chat-count">0</span>/300</span>
          <button class="btn-send" onclick="sendChat()">发送</button>
        </div>
      </div>
    </div>`;

  const seatHTML = s => {
    const a = s.adventurer;
    if (!a) return `
      <div class="seat seat-vacant" title="点击空位让你的冒险者入座">
        <span class="seat-empty-icon">🪑</span>
        <span class="seat-empty-label">空位</span>
      </div>`;
    const drink = s.drink;
    const isMine = a.is_mine;
    return `
      <div class="seat ${isMine ? 'seat-mine' : 'seat-clickable'}" title="${esc(s.label || '')}">
        <span class="seat-name">${esc(a.name)}${isMine ? ' (我的)' : ''}</span>
        ${drink ? `<span class="seat-drink">${drink.icon || '🍺'} ${esc(drink.name)}<span class="drink-price">${drink.price}g</span></span>
                   <p class="seat-drink-text">「${esc(drink.text || '')}」</p>` : `<span class="seat-drink seat-drink-none">还没点饮品</span>`}
        ${s.food ? `<span class="seat-food">🥘 ${esc(s.food.name || '食物')}</span>` : ''}
        ${s.chatter ? `<p class="seat-chatter">${esc(s.chatter)}</p>` : ''}
      </div>`;
  };

  const barHTML = `
    <div class="hall-bar">
      <div class="bar-name">吧台</div>
      <div class="bar-stools">${bar.map(seatHTML).join('')}</div>
    </div>`;

  const tablesHTML = Object.entries(tablesByLabel).map(([label, ss]) => `
    <div class="hall-table">
      <div class="table-name">${esc(label)}</div>
      <div class="table-seats">${ss.map(seatHTML).join('')}</div>
    </div>`).join('');

  const hallHTML = `
    <div class="tavern-hall">
      <div class="tavern-hall-heading"><h3 class="col-title">酒馆大堂 <span style="font-size:12px;color:var(--color-text-secondary);font-weight:400">等级 Lv.${T.level}</span></h3></div>
      ${barHTML}
      <div class="hall-tables">${tablesHTML}</div>
      <div class="hall-hint">点击空位让你的冒险者入座；点自己的冒险者可以点酒 / 离座；点别人的冒险者可以请对方喝东西，对方接受后才扣请客人的金币。在座冒险者偶尔会冒出几句闲聊。</div>
    </div>`;

  const npc = D.npcs && D.npcs.tavern;
  el.innerHTML = `
    ${npc ? `<div class="npc-encounter">
      <div class="npc-avatar">🐱</div>
      <div class="npc-body">
        <span class="npc-name">${esc(npc.name || '神秘来客')}</span>
        <span class="npc-breed">${esc(npc.breed || npc.description || '')}</span>
        <p class="npc-desc">${esc(npc.intro || npc.summary || '')}</p>
      </div>
      <button class="npc-action">可以靠近看看</button>
    </div>` : ''}
    <div class="tavern-layout">
      ${hallHTML}
      ${chatCol}
    </div>`;
  bindChatInput();
}

function sendChat() {
  const inp = $('#chat-input');
  const v = inp.value.trim();
  if (!v) return;
  const box = $('#chat-messages');
  box.insertAdjacentHTML('beforeend', `
    <div class="chat-msg">
      <div class="chat-msg-head">
        <span class="chat-nick">${esc(D.user.nickname)}</span>
        <span class="chat-time">刚刚</span>
      </div>
      <p class="chat-content">${esc(v)}</p>
    </div>`);
  inp.value = '';
  $('#chat-count').textContent = '0';
  box.scrollTop = box.scrollHeight;
}
$('#chat-input')?.addEventListener('input', e => $('#chat-count').textContent = e.target.value.length);

function bindChatInput() {
  const inp = $('#chat-input');
  if (inp && !inp.dataset.bound) {
    inp.dataset.bound = '1';
    inp.addEventListener('input', e => $('#chat-count').textContent = e.target.value.length);
  }
}

/* ============================================================
   活动（赛事）
   ============================================================ */
function renderActivity() {
  const el = $('#tab-activity');
  const act = (D.activity && D.activity.activity) || {};
  const stages = (D.activity && D.activity.stages) || [];
  const finalRanking = (D.activity && D.activity.final_ranking) || [];
  const gameplay = act.gameplay || {};
  const rules = act.rules || {};
  el.innerHTML = `
    <div class="event-header">
      <span class="event-kicker">TAVERN STORY EVENT</span>
      <h2 class="event-title">${esc(act.name || '酒馆活动')}</h2>
      <p class="event-desc">${esc(act.description || '')}</p>
      <div class="event-meta">
        <span class="chip">${esc(gameplay.display_name || '')}</span>
        <span class="chip">每组至多 ${rules.group_size || 8} 人</span>
        <span class="chip">每组前 ${rules.advance_count || 2} 晋级</span>
        <span class="chip">签到窗 ${rules.checkin_minutes || 60} 分钟</span>
        <span class="chip">初始 ${rules.poker_starting_stack || 1000} 筹码 · 盲注 ${rules.poker_small_blind || 10}/${rules.poker_big_blind || 20}</span>
        <span class="chip">每 ${rules.poker_blind_raise_every_hands || 6} 手牌盲注翻倍</span>
        <span class="chip">${act.current_stage ? '第 ' + act.current_stage + ' 阶段' : ''}</span>
      </div>
    </div>

    <div class="event-rules">
      <h4>📜 ${esc(gameplay.display_name || '规则')} · 玩法说明</h4>
      <ul>
        ${(gameplay.table_rules || []).map(r => `<li>${esc(r)}</li>`).join('')}
        <li style="color:var(--amber)">${esc(gameplay.ranking_rule || '')}</li>
        <li>${esc(gameplay.asset_boundary || '')}</li>
      </ul>
    </div>

    <h3 class="col-title">🗓️ 赛程阶段</h3>
    <div style="margin-bottom:14px">
      ${stages.map(s => `
        <div class="stage-row">
          <span class="stage-num">第 ${s.stage_number} 阶段</span>
          <span class="stage-meta">${s.match_count} 场 · 各组错峰开赛；休息且精力足够会自动签到，截止时仍未签到将判负</span>
        </div>`).join('')}
    </div>

    <h3 class="col-title">🏆 决赛结果</h3>
    <div class="rank-list">
      ${finalRanking.map((r, i) => `
        <div class="rank-row ${i === 0 ? 'champion' : i === 1 ? 'runner-up' : i === 2 ? 'third' : ''}">
          <span class="rank-pos">${i + 1}</span>
          <span class="rank-name">${esc(r.adventurer_name)}</span>
          <span class="rank-status">${esc({champion:'冠军', runner_up:'亚军', eliminated:'淘汰'}[r.status] || r.status)}</span>
        </div>`).join('') || '<div class="empty">暂无赛果</div>'}
    </div>`;
}

/* ============================================================
   建筑
   ============================================================ */

/* ============================================================
   传讯邮箱：服务端不定期发放道具福利
   ============================================================ */
const MAILBOX_TITLE = '传讯邮箱';
function mailboxStateFromRole() {
  const role = D.my_adventurer || {};
  const raw = role.mailbox && typeof role.mailbox === 'object' ? role.mailbox : {};
  const letters = Array.isArray(raw.letters) ? raw.letters : [];
  return {
    letters: letters.slice().sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0)),
    unreadCount: letters.filter(letter => !letter.claimedAt).length,
    nextAt: Number(raw.nextAt) || 0,
  };
}
function mailboxBusyReason(role) {
  if (!role) return '';
  if (role.status === 'adventuring') return '角色正在探险';
  if (role.status === 'insighting' || role.taixuInsight) return '角色正在太虚幻境参悟';
  if (role.cultivation || role.status === 'cultivating' || role.status === 'breaking_through') return '角色正在闭关';
  if (role.status === 'in_party') return '角色正在队伍中';
  return '';
}
function mailboxAttachmentsHTML(items) {
  if (!Array.isArray(items) || !items.length) return '';
  return `<div class="mail-attachments">${items.map(item => {
    const rarity = (item && item.rarity) || 'common';
    const color = RARITY_COLOR[rarity] || itemColor(item);
    const rarityName = RARITY_NAME[rarity] || '';
    const qty = Number(item && item.qty) || 1;
    return `<span class="mail-attach" title="${esc((item && item.desc) || '')}">
      <span style="color:${color}">${esc((item && item.name) || '未知道具')}</span>
      ${qty > 1 ? `<b>×${qty}</b>` : ''}
      ${rarityName ? `<em style="color:${color}">${esc(rarityName)}</em>` : ''}
    </span>`;
  }).join('')}</div>`;
}
function renderMailboxModal(result = null) {
  const role = D.my_adventurer;
  if (!role) { closeModal(); return; }
  const mailbox = result && result.mailbox ? result.mailbox : mailboxStateFromRole();
  const letters = Array.isArray(mailbox.letters) ? mailbox.letters : [];
  const unread = Number(mailbox.unreadCount != null ? mailbox.unreadCount : letters.filter(letter => !letter.claimedAt).length) || 0;
  const busy = mailboxBusyReason(role);
  const box = $('#modal-box');
  box.classList.remove('log-modal', 'forge-modal-box');
  const letterList = letters.length
    ? `<div class="lib-list">${letters.map(letter => {
        const claimed = !!letter.claimedAt;
        return `<div class="lib-item mail-letter ${claimed ? 'is-claimed' : 'is-unread'}">
          <div class="mail-letter-head">
            ${claimed ? '' : '<span class="mail-letter-unread-mark" aria-hidden="true"></span>'}
            <span class="li-name">${esc(letter.title || '邮件')}</span>
            <span class="mail-letter-sender">${esc(letter.sender || '')}</span>
          </div>
          <div class="mail-letter-body">${esc(letter.body || '')}</div>
          ${mailboxAttachmentsHTML(letter.items)}
          <div class="li-foot">
            <span class="mail-letter-time">${letter.createdAt ? fmtTime(new Date(letter.createdAt).toISOString()) : ''}</span>
            ${claimed ? '<span class="mail-state">已领取</span>' : busy ? `<span class="mail-state locked" title="${esc(busy)}">状态锁定</span>` : `<button class="btn btn-primary btn-sm" onclick="claimMailboxLetter('${letter.id}')">领取附件</button>`}
          </div>
        </div>`;
      }).join('')}</div>`
    : '<div class="mail-empty">邮箱里暂时没有来信，坊市福利会不定期投递到这里。</div>';
  box.innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="facility-tag">OUTPOST FACILITY · 驻地设施</div>
    <h2 class="modal-title">📮 ${MAILBOX_TITLE} <span class="built-badge">✓ 已建成</span></h2>
    <p class="facility-desc">坊市信使会不定期送来补给与福利，领取后道具直接进入储物袋。</p>
    <div class="mailbox-summary">
      <strong>${esc(role.name)}</strong>
      <span class="mailbox-unread">${unread} 封未读</span>
    </div>
    ${letterList}`;
  showModal();
}
function openMailboxModal() {
  const role = D.my_adventurer;
  if (!role) { toastMsg('请先创建角色'); return; }
  const box = $('#modal-box');
  box.classList.remove('log-modal', 'forge-modal-box');
  box.innerHTML = `<div class="mailbox-loading">正在收取来信…</div>
    <div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal()">关闭</button></div>`;
  showModal();
  if (window.__onlineMode && typeof window.mailboxSync === 'function') {
    window.mailboxSync().then(result => {
      renderMailboxModal(result);
      if (result && Number(result.generated || 0) > 0) toastMsg('📮 收到新的福利邮件');
    }).catch(error => {
      box.innerHTML = `<div class="mailbox-loading">邮箱暂时无法连接：${esc(error && error.message || '网络异常')}</div>
        <div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal()">关闭</button></div>`;
    });
    return;
  }
  if (role.mailbox) renderMailboxModal();
  else toastMsg('邮箱福利仅支持在线角色');
}
async function claimMailboxLetter(mailId) {
  const role = D.my_adventurer;
  if (!role) return;
  if (window.__onlineMode && typeof window.mailboxClaim === 'function') {
    try {
      const result = await window.mailboxClaim(mailId);
      if (result && Array.isArray(result.items) && result.items.length) {
        const summary = result.items.map(item => `${item.name}×${item.qty || 1}`).join('、');
        feedItems(result.items, MAILBOX_TITLE, '邮件福利', '📮', '+');
        toastMsg('已领取：' + summary);
      } else {
        toastMsg('该邮件已领取');
      }
      renderMailboxModal(result);
      if (window.renderMine) renderMine();
      if (window.renderBuilding) renderBuilding();
    } catch (error) {
      toastMsg(error.message || '领取失败');
      renderMailboxModal();
    }
    return;
  }
  toastMsg('邮箱福利仅支持在线角色');
}

let spiritPlatformTimer = null;
function fmtSpiritTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function openSpiritPlatformModal() { renderSpiritPlatformModal(); showModal(); }

  const box = $('#modal-box');
  box.classList.remove('log-modal');
  if (active) {
    const remaining = Math.max(0, Number(active.endsAt) - Date.now());
    const nextSettlement = active.mode === 'cultivate' ? Math.max(0, Number(active.lastSettledAt) + 1800000 - Date.now()) : 0;
    box.innerHTML = `<button class="modal-close" onclick="closeSpiritPlatformModal()">✕</button><div class="facility-tag">OUTPOST FACILITY · 驻地设施</div><h2 class="modal-title">☯ 聚灵台</h2><div class="spirit-active"><div class="spirit-state">${active.mode === 'cultivate' ? '修炼中' : '突破中'}</div><div class="spirit-countdown" id="spirit-countdown">${fmtSpiritTime(remaining)}</div>${active.mode === 'cultivate' ? `<p>下一次经验结算：${fmtSpiritTime(nextSettlement)} · 每半小时 +50 经验</p><button class="btn btn-danger" onclick="exitCultivationEarly()">提前出关</button>` : `<p>闭关突破不可提前出关</p>`}</div>`;
    spiritPlatformTimer = setInterval(() => renderSpiritPlatformModal(), 1000);
    return;

function forgeErrorText(error) {

  if (msg.includes('AI 返回格式异常')) return 'AI 返回格式异常，请稍后重试';
  if (msg.includes('AI 服务繁忙')) return 'AI 服务繁忙，请稍后重试';

async function doForge() {

  let serverCommitted = false;
  let forgeFailureText = 'AI 服务暂时不可用，请稍后重试';
  try {
    const materials = forgeSel.map(x => ({ name: x.name, desc: x.desc, kind: x.kind, src: x.src, rarity: x.rarity || 'common' }));

  if (res.ok && res.item) {
    const inputMats = forgeSel.slice();  // 记录投入材料（先于清空，供流水）
    const item = { name: res.item.name, desc: res.item.desc, qty: 1, kind: res.item.kind || '法宝', rarity: res.item.rarity || 'rare', success: true };
    if (onlineCommittedResult) {
      Object.assign(role, onlineCommittedResult.character || {}, { _char_db_id: role._char_db_id, _char_updated_at: onlineCommittedResult.updated_at, is_mine: true });
    } else if (role._char_db_id && typeof window.forgeOnline === 'function') {
      try {
        const committed = await window.forgeOnline({
          ok: true,
          process: res.process,
          updated_at: role._char_updated_at,
          materials: forgeSel.map(x => ({ name: x.name, src: x.src, rarity: x.rarity || 'common' })),
          item,
        });
        serverCommitted = true;
        Object.assign(role, committed.character, { _char_db_id: role._char_db_id, _char_updated_at: committed.updated_at, is_mine: true });
      } catch (e) {
        toastMsg(e.message || '炼器结算失败，材料未消耗');
        if (go) { go.disabled = false; go.textContent = '🔥 选择材料并炼器'; }
        if (resultEl) resultEl.innerHTML = '<div class="forge-fail">❌ 炼器结算失败，材料未消耗，请刷新后重试。</div>';
        return;
      }

      role.stamina = Math.max(0, (role.stamina || 0) - FORGE_STAMINA_COST);
      forgeSel.forEach(x => consumeForgeMat(role, x));
      const added = bagAdd(role, item);
      if (!added) {
        toastMsg('储物袋已满，无法收纳炼器产物');
        if (go) { go.disabled = false; go.textContent = '🔥 选择材料并炼器'; }
        if (resultEl) resultEl.innerHTML = '<div class="forge-fail">❌ 储物袋已满，炼器未完成。</div>';
        return;
      }
    }
    setForgeCD();
    if (!serverCommitted) {
      if (typeof window.saveRole === 'function') window.saveRole(); else saveRole();
    }
    forgeSel = [];
    // 流水：同一次炼器的材料消耗与法器产出合并展示。
    addFeedItem('⚒️', '炼器坊', '锻造成功', `-${FORGE_STAMINA_COST} 精力`, '#c05a4e', {
      kind: 'forge',
      forgeMaterials: inputMats.map(m => ({ name: m.name, rarity: m.rarity || 'common' })),
      forgeResult: { name: item.name, rarity: item.rarity || 'common' },
      description: item.desc || '', status: '成功',
    });
    const box = $('#modal-box');

  } else {
    // 炼器失败也会消耗本次精力；材料损毁仍按失败规则处理。
    const inputMats = forgeSel.slice();
    let lost = [], kept = [];
    if (onlineCommittedResult) {
      (onlineCommittedResult.lost || []).forEach(name => lost.push(inputMats.find(x => x.name === name) || { name }));
      kept = inputMats.filter(x => !lost.some(y => y.name === x.name));
    } else if (role._char_db_id && typeof window.forgeOnline === 'function') {
      try {
        const committed = await window.forgeOnline({ ok: false, process: res.process, reason: res.reason, materials: inputMats.map(x => ({ name: x.name, src: x.src })), item: { ...(res.item || { name: '未定型法器' }), success: false } });
        serverCommitted = true;
        Object.assign(role, committed.character, { _char_db_id: role._char_db_id, _char_updated_at: committed.updated_at, is_mine: true });
        (committed.lost || []).forEach(name => lost.push(inputMats.find(x => x.name === name) || { name }));
        kept = inputMats.filter(x => !lost.some(y => y.name === x.name));
      } catch (e) { toastMsg(e.message || '炼器结算失败'); return; }
    } else {
      role.stamina = Math.max(0, (role.stamina || 0) - FORGE_STAMINA_COST);
      forgeSel.forEach(x => { if (Math.random() < 0.5) { consumeForgeMat(role, x); lost.push(x); } else kept.push(x); });
    }
    setForgeCD();
    if (!serverCommitted) {
      if (typeof window.saveRole === 'function') window.saveRole(); else saveRole();
    }
    // 流水：失败损毁的材料
    if (lost.length) feedItems(lost, '炼器坊', '炼器失败损毁', '🔥', '-');
    addFeedItem('⚒️', '炼器坊', '炼器失败', `-${FORGE_STAMINA_COST} 精力`, '#c05a4e', {
      kind: 'forge',
      forgeMaterials: inputMats.map(m => ({ name: m.name, rarity: m.rarity || 'common' })),
      forgeResult: { name: '未定型法器', rarity: 'common' },
      description: res.process || '炉火失衡，未能成器。', status: '失败',
    });
    // 失败后清空已选，刷新炼器界面（不能带着旧选择再次点击炼出相同结果）
    const box = $('#modal-box');
    const lostNames = lost.map(x => esc(x.name)).join('、');
    const keptNames = kept.map(x => esc(x.name)).join('、');
    forgeSel = [];
    toastMsg('❌ 炼器失败，已重置材料选择');
    showForgeResultDialog({ ok: false, item: res.item, materials: inputMats, process: res.process, reason: `${res.reason || '炉火失衡，未能成器'}${lost.length ? ' 损毁：' + lostNames : ''}${kept.length ? ' 保留：' + keptNames : ''}` });
    renderMine(); renderAdventurers(); renderTavern();
  }
}
function consumeForgeMat(role, x) {
  if (x.src === 'equip') {
    const e = (role.equipment || []).find(i => i.name === x.name);
    if (e) { e.qty = (e.qty || 1) - 1; if (e.qty <= 0) { const i = role.equipment.indexOf(e); if (i >= 0) role.equipment.splice(i, 1); } return; }
  }
  const b = (role.bag || []).find(i => i.name === x.name);
  if (b) { b.qty = (b.qty || 1) - 1; if (b.qty <= 0) { const i = role.bag.indexOf(b); if (i >= 0) role.bag.splice(i, 1); } }
}
async function aiForge(materials) {
  const r = await fetch('/api/ai/forge', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ materials }),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '炼器失败');
  return j;
}

/* ---------- 最近动态：道具/灵石流水（真实记录 + 持久化） ---------- */
const FEED_KEY = 'xiuxian_feed';
const FEED_MAX = 100;
function loadFeed() {
  try {
    const arr = JSON.parse(localStorage.getItem(FEED_KEY) || 'null');
    if (Array.isArray(arr)) D.my_feed = normalizeFeedEntries(arr);
  } catch (e) { /* 损坏忽略 */ }
}
/* 将旧版“一条动态带多个 changes”的记录转换为截图所示的逐项流水。 */
function normalizeFeedEntries(entries) {
  const out = [];
  (entries || []).forEach(entry => {
    if (!entry) return;
    if (!Array.isArray(entry.changes) || !entry.changes.length) {
      if (entry.kind === 'forge' && entry.title === '铁匠铺') out.push({ ...entry, title: '炼器坊', sub: entry.sub || '锻造成功' });
      else out.push(entry);
      return;
    }
    entry.changes.forEach(change => {
      const raw = String(change && change.delta || '').trim();
      if (!raw) return;
      const gold = raw.match(/^([+-]?\d+(?:\.\d+)?)\s*(灵石|金币)$/);
      const item = raw.match(/^([+-]?\d+)\s+(.+)$/);
      let title = entry.title || '系统';
      let delta = raw;
      if (gold) { title = gold[2]; delta = `${gold[1]}${gold[2] === '金币' ? '.00' : ''}`; }
      else if (item && !/突破|成功|失败/.test(item[2])) { title = item[2].trim(); delta = item[1]; }
      out.push({ icon: entry.icon, title: entry.kind === 'forge' ? '炼器坊' : title, sub: entry.kind === 'forge' ? (entry.sub || '锻造成功') : (entry.sub || ''), delta, color: change.color || '', kind: entry.kind, forgeMaterials: entry.forgeMaterials, forgeResult: entry.forgeResult, description: entry.description, time: entry.time });
    });
  });
  return out.slice(0, FEED_MAX);
}
function saveFeed() {
  try { localStorage.setItem(FEED_KEY, JSON.stringify((D.my_feed || []).slice(0, FEED_MAX))); } catch (e) { /* 容量超限忽略 */ }
}
/* 将同一次操作的多项收支聚为一条动态。 */
function addFeedBatch(icon, title, sub, changes) {
  if (!D.my_feed) D.my_feed = [];
  const entries = (changes || []).filter(c => c && c.delta).map(c => ({ delta: String(c.delta), color: c.color || '' }));
  if (!entries.length) return;
  D.my_feed.unshift({ icon, title, sub, changes: entries, time: fmtTimeFull(new Date().toISOString()) });
  if (D.my_feed.length > FEED_MAX) D.my_feed.length = FEED_MAX;
  saveFeed();
  if (document.getElementById('tab-mine')) renderMine();
}

function feedItemChanges(items, sign) {

function toggleItem(btn, key) {
  if (charSel.items.has(key)) {
    charSel.items.delete(key);

function loadRole() {
  try {
    const r = JSON.parse(localStorage.getItem('xiuxian_role') || 'null');
    if (r) {
      if ((Number(r.hp || 0) <= 0) || r.isDead) {
        localStorage.removeItem('xiuxian_role');
        window.__deadRoleName = r.name || '旧角色';
        return;
      }
      // 兼容旧存档：补充储物袋/功法字段
      if (!Array.isArray(r.bag)) r.bag = [];
      if (!Array.isArray(r.equipment)) r.equipment = [];
      if (!Array.isArray(r.skills)) {
        const rootKey = Object.keys(ROOT_KEYS).find(k => (r.traits || []).includes(ROOT_KEYS[k].label)) || 'jin';
        r.skills = ROOT_SKILLS[rootKey].map(s => ({ ...s }));
      }
      // 兼容旧存档：无性别字段默认男
      if (r.gender !== '女') r.gender = '男';
      // 兼容旧存档：功法库（已学未装备）
      if (!Array.isArray(r.skillPool)) r.skillPool = [];
      // 兼容旧存档：精力回复时间戳（缺失时从此刻起算，不追溯补精力）
      if (!r.staminaTs) r.staminaTs = Date.now();
      // 兼容旧存档：气血回复时间戳
      if (!r.hpTs) r.hpTs = Date.now();
      // 兼容旧存档：技能阶位回填（按名称匹配初始技能/藏经阁，匹配不到默认黄阶）
      const tierByName = {};
      Object.values(ROOT_SKILLS).flat().forEach(s => { if (s.tier) tierByName[s.name] = s.tier; });
      LIBRARY_BOOKS.forEach(b => { if (b.tier) tierByName[b.name] = b.tier; });
      let tierPatched = false;
      [...(r.skills || []), ...(r.skillPool || [])].forEach(s => {
        if (s && !SKILL_TIERS.includes(s.tier)) { s.tier = tierByName[s.name] || '黄阶'; tierPatched = true; }
      });
      D.adventurers = [r];
      D.my_adventurer = r;
      if (tierPatched) saveRole();  // 回填后持久化，避免每次加载重复处理
      // 重伤倒计时：载入时清理已过期的受伤特质
      if (clearExpiredInjury(r)) saveRole();
    }
  } catch (e) { /* 忽略损坏存档 */ }
}

function saveRole() {
  if (D.my_adventurer) localStorage.setItem('xiuxian_role', JSON.stringify(D.my_adventurer));
}
function bagAdd(role, item) {
  if (!Array.isArray(role.bag)) role.bag = [];
  if (role.bag.length >= 100) return false;
  const cleanName = String(item.name || '').replace(/�+/g, '').trim() || '未知道具';
  const cleanDesc = String(item.desc || '').replace(/�+/g, '').trim();
  const same = role.bag.find(b => b.name === cleanName);
  const rarity = item.rarity || 'common';
  if (same) { same.qty = (same.qty || 1) + (item.qty || 1); if (item.rarity) same.rarity = rarity; if (cleanDesc) same.desc = cleanDesc; if (item.kind) same.kind = item.kind; return true; }
  role.bag.push({ name: cleanName, desc: cleanDesc, kind: item.kind || '杂物', qty: item.qty || 1, rarity });
  return true;
}
function equipFromBag(bagIdx) {   // 储物袋 -> 随身法宝
  const role = D.my_adventurer;
  if (!role) return;
  if (window.__onlineMode && typeof window.onlineCharacterAction === 'function') {
    window.onlineCharacterAction('inventory_equip', { index: bagIdx }).then(() => refreshAdvSec('combat')).catch(e => toastMsg(e.message || '装备失败'));
    return;
  }
  const it = (role.bag || [])[bagIdx];
  if (!it) return;
  if ((role.equipment || []).length >= 5) { toastMsg('随身法宝已满（最多 5 件），请先取下一件'); return; }
  role.bag.splice(bagIdx, 1);
  role.equipment.push({ name: it.name, desc: it.desc || '', qty: it.qty, rarity: it.rarity });
  saveRole();
  refreshAdvSec('combat');
}
function unequipToBag(eqIdx) {    // 随身法宝 -> 储物袋
  const role = D.my_adventurer;
  if (!role) return;
  if (window.__onlineMode && typeof window.onlineCharacterAction === 'function') {
    window.onlineCharacterAction('inventory_unequip', { index: eqIdx }).then(() => refreshAdvSec('combat')).catch(e => toastMsg(e.message || '卸下失败'));
    return;
  }
  const it = (role.equipment || [])[eqIdx];
  if (!it) return;
  if ((role.bag || []).length >= 100) { toastMsg('储物袋已满（100 格）'); return; }
  role.equipment.splice(eqIdx, 1);
  role.bag.push({ name: it.name, desc: it.desc || '', qty: it.qty, rarity: it.rarity });
  saveRole();
  refreshAdvSec('combat');
}
function equipSkill(poolIdx) {    // 功法库 -> 功法栏
  const role = D.my_adventurer;
  if (!role) return;
  if (window.__onlineMode && typeof window.onlineCharacterAction === 'function') {
    window.onlineCharacterAction('skill_equip', { index: poolIdx }).then(() => refreshAdvSec('profile')).catch(e => toastMsg(e.message || '装备失败'));
    return;
  }
  const sk = (role.skillPool || [])[poolIdx];
  if (!sk) return;
  if ((role.skills || []).length >= MAX_SKILLS) { toastMsg('功法栏已满（上限 ' + MAX_SKILLS + ' 种），请先卸下一门功法'); return; }
  role.skillPool.splice(poolIdx, 1);
  if (!role.skills) role.skills = [];
  role.skills.push(sk);
  saveRole();
  refreshAdvSec('profile');
  toastMsg('⚔️ 已装备《' + sk.name + '》');
}
function unequipSkill(slotIdx) {  // 功法栏 -> 功法库
  const role = D.my_adventurer;
  if (!role) return;
  if (window.__onlineMode && typeof window.onlineCharacterAction === 'function') {
    window.onlineCharacterAction('skill_unequip', { index: slotIdx }).then(() => refreshAdvSec('profile')).catch(e => toastMsg(e.message || '卸下失败'));
    return;
  }
  const sk = (role.skills || [])[slotIdx];
  if (!sk) return;
  role.skills.splice(slotIdx, 1);
  if (!role.skillPool) role.skillPool = [];
  role.skillPool.push(sk);
  saveRole();
  refreshAdvSec('profile');
  toastMsg('📦 已卸下《' + sk.name + '》，存入功法库');
}

/* ============================================================
   精力现实时间回复：每分钟回复 1 点，封顶 max_stamina
   用 staminaTs 记录上次结算时刻，跨会话离线时间也累计
   ============================================================ */
function regenerateStamina() {
  const role = D.my_adventurer;
  if (!role) return false;
  const now = Date.now();
  const ts = Number(role.staminaTs || now);
  const max = role.max_stamina || 100;
  if (ts > now) { role.staminaTs = now; if (!window.__onlineMode) saveRole(); return false; }  // 时钟异常兜底
  const mins = Math.floor((now - ts) / 60000);
  if (mins <= 0) return false;
  const before = role.stamina || 0;
  role.stamina = Math.min(max, before + mins);
  // 只推进整分钟，剩余秒数留到下次（不浪费）
  role.staminaTs = ts + mins * 60000;
  if (role.stamina >= max) role.staminaTs = now;  // 满精力后计时归零，避免无谓累加
  if (!window.__onlineMode) saveRole();
  return role.stamina !== before;
}
/* ============================================================
   气血现实时间回复：每 3 分钟回复 1 点，封顶 max_hp
   用 hpTs 记录上次结算时刻，跨会话离线时间也累计
   ============================================================ */
function regenerateHp() {
  const role = D.my_adventurer;
  if (!role) return false;
  const now = Date.now();
  // 探险中不回复气血（战斗中无法恢复）：计时推进但血量不动，
  // 避免探险期间的时间在结算后一次性补回（否则扣血会被补满，结算战损与实际气血不符）
  if (role.status === 'adventuring') { role.hpTs = now; return false; }
  const ts = Number(role.hpTs || now);
  const max = role.max_hp || 100;
  if (ts > now) { role.hpTs = now; if (!window.__onlineMode) saveRole(); return false; }  // 时钟异常兜底
  const intervals = Math.floor((now - ts) / HP_REGEN_MS);
  if (intervals <= 0) return false;
  const before = role.hp || 0;
  role.hp = Math.min(max, before + intervals);
  role.hpTs = ts + intervals * HP_REGEN_MS;
  if (role.hp >= max) role.hpTs = now;  // 满气血后计时归零
  if (!window.__onlineMode) saveRole();
  return role.hp !== before;
}
function regenerateAiHp() {
  const now = Date.now();
  let changed = false;
  const companions = [
    ...(D.adventurers || []).filter(a => a && (a.is_npc || a.isNpc)),
    ...((matchQueue && matchQueue.npcs) || []),
  ];
  companions.forEach(ai => {
    if (ai.status === 'adventuring') { ai.hpTs = now; return; }
    const ts = Number(ai.hpTs || now);
    const intervals = Math.floor((now - ts) / HP_REGEN_MS);
    if (intervals <= 0) return;
    const before = Number(ai.hp || 0);
    ai.hp = Math.min(Number(ai.max_hp || 100), before + intervals);
    ai.hpTs = ai.hp >= Number(ai.max_hp || 100) ? now : ts + intervals * HP_REGEN_MS;
    changed = changed || ai.hp !== before;
  });
  return changed;
}
/* 精力显示刷新：仅就地更新 DOM 数值，不重建页面（避免打断输入/滚动） */

function advPagerHTML(cur, total) {
  const buttons = [];
  const add = p => buttons.push(p === cur ? `<span class="page-btn cur">${p}</span>` : `<button class="page-btn" onclick="goAdvPage(${p})">${p}</button>`);
  const addDots = () => buttons.push('<span class="page-dots">…</span>');
  add(1);
  if (total > 1) {
    const lo = Math.max(2, cur - 2), hi = Math.min(total - 1, cur + 2);
    if (lo > 2) addDots();
    for (let p = lo; p <= hi; p++) add(p);
    if (hi < total - 1) addDots();
    add(total);
  }
  buttons.unshift(cur > 1 ? `<button class="page-btn" onclick="goAdvPage(${cur - 1})">‹</button>` : '<span class="page-btn off">‹</span>');
  buttons.push(cur < total ? `<button class="page-btn" onclick="goAdvPage(${cur + 1})">›</button>` : '<span class="page-btn off">›</span>');
  return buttons.join('');
}

function memberColor(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return MEMBER_COLORS[h % MEMBER_COLORS.length];
}
/* 将段落中出现的所有成员名分别用不同颜色高亮（仅文字色，无底色）；按成员在队伍中的索引取色，保证同队不同色 */
function highlightNames(text, party) {
  const e = esc(text);
  if (!logNameHl || !party || !party.length) return e;
  const names = [...new Set(party.map(m => m.name).filter(Boolean))].sort((a, b) => b.length - a.length);
  if (!names.length) return e;
  const colorOf = name => {
    const idx = party.findIndex(m => m.name === name);
    return MEMBER_COLORS[Math.max(0, idx) % MEMBER_COLORS.length];
  };
  let out = e;
  const tokens = [];
  names.forEach((n, i) => {
    const tk = '\x01' + i + '\x02';
    tokens.push([tk, n]);
    out = out.split(n).join(tk);
  });
  tokens.forEach(([tk, n]) => {
    out = out.split(tk).join(`<mark class="nm-hl" style="--nm:${colorOf(n)}">${n}</mark>`);
  });
  return out;
}

function scheduleLogDetailSteps(steps, partyNames, rootEl, opts = {}) {
  cancelLogDetailChunks();
  const container = rootEl && rootEl.querySelector('.log-detail-steps');
  if (!container) return;
  const total = Number(container.dataset.total ?? steps.length) || 0;
  let rendered = Number(container.dataset.rendered ?? container.querySelectorAll('.log-detail-step').length) || 0;
  container.dataset.total = total;
  container.dataset.rendered = rendered;
  if (rendered >= total) {
    container.dataset.complete = '1';
    return;
  }
  const chunkSize = opts.chunkSize || LOG_STEP_CHUNK;
  logDetailChunkTimer = setInterval(() => {
    if (!document.body.contains(container)) {
      cancelLogDetailChunks();
      return;
    }
    rendered = Number(container.dataset.rendered || container.querySelectorAll('.log-detail-step').length) || 0;
    const next = steps.slice(rendered, rendered + chunkSize);
    if (!next.length) {
      container.dataset.complete = '1';
      cancelLogDetailChunks();
      return;
    }
    container.insertAdjacentHTML('beforeend', next.map((st, i) => logStepHTML(st, rendered + i, partyNames)).join(''));
    rendered += next.length;
    container.dataset.rendered = rendered;
    if (rendered >= total) {
      container.dataset.complete = '1';
      cancelLogDetailChunks();
    }
  }, 16);
}

function likeMember(logId, name) {
  const log = findLogDetail(logId);
  if (!log || !log.settlement) return;
  const m = log.settlement.members.find(x => x.name === name);
  if (!m) return;
  let likes = {};
  try { likes = JSON.parse(localStorage.getItem('xiuxian_likes') || '{}'); } catch (e) { likes = {}; }
  const key = String(logId);
  const done = likes[key] || [];
  if (done.includes(name)) { toastMsg('本局已为「' + name + '」点过赞'); return; }
  done.push(name);
  likes[key] = done;
  try { localStorage.setItem('xiuxian_likes', JSON.stringify(likes)); } catch (e) { /* 忽略 */ }
  m.praise = (m.praise || 0) + 1;
  const summary = (D.logs || []).find(x => logKey(x) === String(logId));
  const sm = summary && summary.settlement && summary.settlement.members ? summary.settlement.members.find(x => x.name === name) : null;
  if (sm && sm !== m) sm.praise = m.praise;
  saveLogs();
  renderLogs();
}

function elemMatchMod(actor, sk) {

/* 副本阶段计划：普通 10 步（10 段以上即可，允许一行一段）；隐藏副本（首领 10% 概率触发）额外含首领阶段，共 12 步 */
/* 副本阶段计划：整局 10~40 段，每段 ≤250 字（不设最低字数，长短随叙事节奏）；
   步数按阶段加权分配——入谷/归途各 1 段固定，其余按 探索/战斗/搜刮/首领 权重随机分配；
   首领阶段：普通副本 10% 概率遇到（1 段起），隐藏副本必定遭遇（普通首领筑基初期 + 隐藏首领筑基中期）；
   本局敌人为 0 种时跳过战斗阶段 */
function buildPlan(isHidden, enemyCount, specialEvent, breakthrough) {
  const hasBoss = isHidden || specialEvent || Math.random() < 0.1;
  const hasBattle = (enemyCount || 0) > 0;
  const total = 10 + Math.floor(Math.random() * 31);  // 10~40 段
  // 各阶段最低段数：探索 2、搜刮 2、战斗 2（有敌人）、首领 1（有首领；隐藏副本保底 2，确保普通首领 + 隐藏首领都遭遇）；入谷/归途固定各 1
  const minE = 2, minL = 2, minB = hasBattle ? 2 : 0, minBo = hasBoss ? (isHidden ? 2 : 1) : 0;
  let explore = minE, loot = minL, battle = minB, boss = minBo;
  let extra = Math.max(0, total - 2 - minE - minL - minB - minBo);
  while (extra > 0) {
    const r = Math.random();
    if (r < 0.34) explore++;
    else if (r < 0.58) loot++;
    else if (r < 0.82 && hasBattle) battle++;
    else if (hasBoss) boss++;
    else explore++;
    extra--;
  }
  const p = [
    { key: 'opening', label: '入谷', steps: 1, check: false },
    { key: 'explore', label: '探索', steps: explore, check: true },
  ];
  if (hasBattle) p.push({ key: 'battle', label: '战斗', steps: battle, check: true });
  if (hasBoss) p.push({ key: 'boss', label: '首领', steps: boss, check: true });
  p.push({ key: 'loot', label: '搜刮', steps: loot, check: true });
  // 突破试炼：练气十层满修为触发后，在归途前安排一段突破试炼（成功判定 1~2 段）
  if (breakthrough) p.push({ key: 'breakthrough', label: '突破', steps: 1 + Math.floor(Math.random() * 2), check: true });
  p.push({ key: 'closing', label: '归途', steps: 1, check: false });
  return p;
}
function buildNarrativeFocusPlan(dg) {
  const partySize = Math.max(1, (dg.party || []).length);
  const middle = [];
  for (const plan of dg.plan || []) {
    if (plan.key === 'opening' || plan.key === 'closing') continue;
    for (let i = 0; i < (plan.steps || 0); i++) middle.push({ stageKey: plan.key });
  }
  const windowCount = middle.length > 0 ? Math.max(Math.ceil(middle.length / 3), Math.min(partySize, Math.floor(middle.length / 2))) : 0;
  const baseSize = windowCount ? Math.floor(middle.length / windowCount) : 0;
  let larger = windowCount ? middle.length % windowCount : 0;
  let cursor = 0, windowId = 0, actorIndex = 0;
  while (cursor < middle.length) {
    const size = middle.length - cursor === 1 ? 1 : baseSize + (larger > 0 ? 1 : 0);
    if (larger > 0) larger--;
    for (let i = 0; i < size && cursor < middle.length; i++, cursor++) {
      const highlight = i === size - 1;
      middle[cursor] = { ...middle[cursor], mode: 'focus', windowId, focusStep: i + 1, windowSize: size, actorIndex, supportIndex: highlight || partySize < 2 ? null : (actorIndex + 1) % partySize, support2Index: highlight || partySize < 3 ? null : (actorIndex + 2) % partySize, highlight };
    }
    actorIndex = (actorIndex + 1) % partySize;
    windowId++;
  }
  const breakthroughEntries = middle.filter(step => step.stageKey === 'breakthrough');
  if (breakthroughEntries.length) {
    const breakthroughWindowId = windowId++;
    breakthroughEntries.forEach((step, index) => Object.assign(step, {
      windowId: breakthroughWindowId,
      focusStep: index + 1,
      windowSize: breakthroughEntries.length,
      actorIndex: 0,
      supportIndex: null,
      support2Index: null,
      highlight: index === breakthroughEntries.length - 1,
    }));
  }
  const ordered = [];
  let middleIndex = 0;
  for (const plan of dg.plan || []) {
    for (let i = 0; i < (plan.steps || 0); i++) {
      ordered.push(plan.key === 'opening' || plan.key === 'closing'
        ? { stageKey: plan.key, mode: 'group', windowId: null, focusStep: 1, windowSize: 1, actorIndex: 0, supportIndex: partySize > 1 ? 1 : null, support2Index: partySize > 2 ? 2 : null, highlight: false }
        : middle[middleIndex++]);
    }
  }

}

function saveRuns() {

function restoreRuns() {
  try {

    localStorage.removeItem(RUNS_KEY);
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr) || !arr.length) { clearStuckStatus(); return; }
    const role = D.my_adventurer;
    const now = Date.now();
    let restored = 0;
    arr.forEach(s => {
      if (!s || !s.party || !s.dungeon || !s.plan) return;
      const mine = s.party.find(m => m && m.is_mine);
      // 角色已不存在（存档被清）→ 放弃
      if (mine && (!role || role.id !== mine.id)) return;
      // 中断超过 6 小时 → 转为失败日志（保留记录），不再恢复陈旧副本
      if (now - (s.startedAt || 0) > 6 * 3600 * 1000) { interruptRunToLog(s); return; }
      // 重新绑定我的角色为活动对象，保证结算写回真实角色
      s.party = s.party.map(m => (m && m.is_mine && role) ? role : m);
      if (!s.memberGains) s.memberGains = {};
      s.party.forEach(m => { if (m && !s.memberGains[m.id]) s.memberGains[m.id] = { acts: 0, rolls: [], damage: 0, loot: [], traits: [], crits: 0, fumbles: 0 }; });
      s.status = 'running';
      if (s.logNumber == null) s.logNumber = nextLogId();
      s.timer = null;
      activeDungeons.push(s);
      restored++;
    });
    if (restored) {
      toastMsg('⏳ 检测到 ' + restored + ' 个中断的探险，已自动恢复推进');
      activeDungeons.forEach(dg => scheduleTick(dg));

}

/* 练气层数文字：1→一层 … 10→十层 */
const QI_LAYER = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
/* 本局敌人挑选：从副本敌人池随机抽 0~3 种，每种随机修为（练气 1~10 层分布）；

function rollEnemies(dungeon, specialEvent) {
  const pool = (dungeon.enemies || []).slice();
  const n = specialEvent ? 1 + Math.floor(Math.random() * 3) : Math.floor(Math.random() * 4);  // 特殊事件 1~3 种，普通 0~3 种
  const picked = [];
  while (picked.length < n && pool.length) {
    picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return picked.map(e => {
    let layer = 1 + Math.floor(Math.random() * 10);
    if (specialEvent) layer = Math.min(10, layer + 2 + Math.floor(Math.random() * 3));  // 修为 +2~4 层
    return { ...e, realm: '练气' + QI_LAYER[layer] + '层' };
  });
}
/* AI 开本结果归一化：隐藏/特殊事件/突破与敌人名单由 AI 决定，敌人必须来自副本池 */
function normalizeAiSetupClient(setup, base) {
  const pool = Array.isArray(base && base.enemies) ? base.enemies : [];
  const seen = new Set();
  const enemies = (Array.isArray(setup && setup.enemies) ? setup.enemies : []).map(entry => {
    const name = String(entry && entry.name || '').replace(/\s+/g, '').trim();
    const src = pool.find(x => String(x.name || '').trim() === name);
    if (!src || seen.has(name)) return null;
    seen.add(name);
    const realm = String(entry && entry.realm || '').trim();
    return { ...src, realm: /^(练气[一二三四五六七八九十]+层|筑基(初期|前期|中期|后期))$/.test(realm) ? realm : '练气一层' };
  }).filter(Boolean);
  const specialEvent = !!(setup && setup.specialEvent);
  return {
    isHidden: !!(setup && (setup.isHidden === true || setup.hidden === true)),
    specialEvent,
    breakthrough: !!(setup && setup.breakthrough),
    enemies: enemies.slice(0, specialEvent ? 4 : 3),

}
function pickDungeon(role) {

function resolveAiItemUse(dg, actor, entry) {

/* AI 单步掉落登记：合并数量与稀有度，并同步写入 gainedLoot */
function recordAiLoot(dg, actor, entries) {

    const name = String(entry && entry.name || '').replace(/\s+/g, '').trim().slice(0, 12);
    if (!LootSettlement.isValidLootName(name)) continue;
    const qty = Math.max(1, Math.min(99, Math.round(Number(entry && entry.qty) || 1)));
    const rarity = ['common', 'rare', 'epic', 'legendary'].includes(entry && entry.rarity) ? entry.rarity : null;
    const existing = dg.aiLoot.find(x => x.name === name);
    if (existing) existing.qty += qty;

  return 17 + Math.min(2, lv - 17);

/* 境界差修正：自身修为高于敌人每层 +1（封顶 +4），低于敌人每层 -1（封顶 -4）；敌人修为未知则 0 */
function realmDiffMod(actor, enemy) {
  if (!enemy) return 0;
  const ev = enemyRealmVal(enemy.realm);
  if (!ev) return 0;
  return Math.max(-4, Math.min(4, actorRealmVal(actor) - ev));
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pick2(arr) {
  if (!arr || !arr.length) return ['', ''];
  if (arr.length < 2) return [arr[0], arr[0]];
  const i = Math.floor(Math.random() * arr.length);
  let j; do { j = Math.floor(Math.random() * arr.length); } while (j === i);
  return [arr[i], arr[j]];
}
function replaceVars(s, dg, actor, support, support2, attrKey, roll, mod, total, itemUse, skillUse) {
  const d = dg.dungeon;
  const items = actor.equipment || [];  // 叙事只读取随身法宝，储物袋不参与
  const supItems = support ? (support.equipment || []) : [];
  const skills = (actor.skills || []).map(s => s.name);
  const shufa = (actor.skills || []).find(s => s.type === '术法');
  const warn = pick(['入此谷者，勿深', '雾起勿行，夜半勿留', '噬骨之渊，慎入', '前路凶险，量力而行']);
  const cur = dg._curEnemy || {};
  // 每件装备独立读取描述：{item}/{itemDesc} 引用判定选中的单件装备；动作按装备类型（防具/武器/丹药/符箓/工具）
  const usedItem = itemUse && itemUse.item ? itemUse.item : null;
  const singleItemObj = usedItem || items[0] || null;
  const singleItem = singleItemObj ? singleItemObj.name : '随身法宝';
  const singleItemDesc = singleItemObj ? (singleItemObj.desc || '') : '';
  const kind = (singleItemObj && singleItemObj.kind) || 'misc';
  const KA = KIND_ACTION[kind] || KIND_ACTION.misc;
  // 本步释放的术法/功法：{skill}/{skillDesc}/{skillType} 引用判定选中的技能及其描述
  const usedSkill = skillUse && skillUse.name ? skillUse : null;
  const singleSkill = usedSkill ? usedSkill.name : (shufa ? shufa.name : (skills[0] || '基础术法'));
  const singleSkillDesc = usedSkill ? (usedSkill.desc || '') : (shufa ? (shufa.desc || '') : '');
  const singleSkillType = usedSkill ? (usedSkill.type || '功法') : '功法';
  // 性别代词：{he}/{his} 按本步主角性别替换（他/她、他的/她的）
  const he = actor.gender === '女' ? '她' : '他';
  const his = actor.gender === '女' ? '她的' : '他的';
  return s
    .replaceAll('{actor}', actor.name)
    .replaceAll('{he}', he)
    .replaceAll('{his}', his)
    .replaceAll('{support}', support ? support.name : actor.name)
    .replaceAll('{support2}', support2 ? support2.name : (support ? support.name : actor.name))
    .replaceAll('{supportPers}', support ? (support.personality || '谨慎') : '谨慎')
    .replaceAll('{person}', actor.personality || '谨慎')
    .replaceAll('{items}', singleItem)
    .replaceAll('{item}', singleItem)
    .replaceAll('{itemDesc}', singleItemDesc)
    .replaceAll('{itemHold}', KA.hold)
    .replaceAll('{itemUseVerb}', KA.use)
    .replaceAll('{itemRole}', KA.role)
    .replaceAll('{items2}', supItems.length ? supItems[0].name : singleItem)
    .replaceAll('{supportItems}', supItems.length ? supItems[0].name : singleItem)
    .replaceAll('{skill}', singleSkill)
    .replaceAll('{skillDesc}', singleSkillDesc)
    .replaceAll('{skillType}', singleSkillType)
    .replaceAll('{skills}', skills.length ? skills.join('、') : '入门功法')
    .replaceAll('{attr}', ATTR_NAME[attrKey] || '道行')
    .replaceAll('{roll}', roll ? `本步判定结果：${total}` : '')
    .replaceAll('{total}', total)
    .replaceAll('{name}', d.name)
    .replaceAll('{warning}', warn)
    .replaceAll('{enemy}', cur.name || '敌人')
    .replaceAll('{enemyDesc}', cur.desc || '凶威赫赫')
    .replaceAll('{bossReward}', (cur.reward && cur.reward.name) || '首领遗物')
    .replaceAll('{bossRewardDesc}', (cur.reward && cur.reward.desc) || '来历不明的珍宝');
}
function localStory(dg, stageKey, actor, support, support2, attrKey, roll, mod, total, itemUse, skillUse) {
  const d = dg.dungeon;
  if (stageKey === 'opening' || stageKey === 'closing') {
    return pick2(NARR[stageKey]).map(s => replaceVars(s, dg, actor, support, support2, attrKey, roll, mod, total, itemUse, skillUse)).join('');
  }
  const scene = stageKey === 'explore' ? d.explore[Math.floor(Math.random() * d.explore.length)]
    : (stageKey === 'battle' || stageKey === 'boss') ? (dg._curEnemy ? dg._curEnemy.name : '强敌')
    : '战场';
  const out = total >= 18 || roll === 20 ? 'crit' : total >= 12 ? 'good' : total >= 7 ? 'mid' : total >= 2 ? 'bad' : 'fumble';
  // 每步随机采用「个人段」或「配合段」：多人游戏中无主角之分，两种叙事自然混排
  const TN = NARR[stageKey];
  const T = (Math.random() < 0.5 && TN.solo) ? TN.solo : TN;
  const [d1, d2] = pick2(T.detail || TN.detail);
  const rv = s => replaceVars(s, dg, actor, support, support2, attrKey, roll, mod, total, itemUse, skillUse);
  // 装备使用句：判定成功的装备单独读取描述并发挥作用；失败则无功而返
  let equipSentence = '';
  if (itemUse) {
    const usePool = EQUIP_USE[stageKey] || EQUIP_USE.battle;
    equipSentence = itemUse.success
      ? rv(pick(usePool.ok)).replace('{where}', scene).replace('{enemy}', scene)
      : rv(pick(usePool.fail)).replace('{where}', scene).replace('{enemy}', scene);
  }
  // 术法/功法释放句（优先级最高，紧跟行动句）：成功后按技能描述演绎，失败则如实写施法受挫
  let skillSentence = '';
  if (skillUse) {
    const usePool = SKILL_USE[stageKey] || SKILL_USE.battle;
    skillSentence = skillUse.success
      ? rv(pick(usePool.ok)).replace('{where}', scene).replace('{enemy}', scene)
      : rv(pick(usePool.fail)).replace('{where}', scene).replace('{enemy}', scene);
  }
  const parts = [
    rv(pick(T.setup)).replace('{where}', scene),
    rv(pick(T.act)),
    skillSentence,
    rv(pick(T.out[out])).replace('{where}', scene).replace('{enemy}', scene),
    equipSentence,
    rv(d1).replace('{where}', scene),
    rv(d2).replace('{where}', scene),
    rv(pick(TN.follow)),
  ];
  return parts.join('');
}
async function generateStep(dg, stageKey, actor, support, support2, attrKey, roll, mod, total, itemUse, skillUse) {
  const focus = (dg.focusPlan || [])[dg.totalStep] || { mode: 'focus', focusStep: 1, windowSize: 1, highlight: false };
  const cast = focus.mode === 'group' ? dg.party : [actor, support, support2].filter(Boolean);
  const allowedCharacters = [...new Set(cast.map(member => member && member.name).filter(Boolean))];
  const forbiddenCharacters = [...new Set(dg.party.map(member => member && member.name).filter(Boolean))].filter(name => !allowedCharacters.includes(name));
  // 每次探险步骤都尝试接入 AI 生成（server.js 提供 /api/ai/story）；失败由上层取消探险
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 150000);  // 前端超时 150s，避免无限挂起
  try {
    const r = await fetch('/api/ai/story', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      signal: ctrl.signal,
      body: JSON.stringify({
        dungeon: dg.dungeon.name,
        baseDungeon: dg.dungeon.baseName || dg.dungeon.name,
        isHidden: !!dg.dungeon.isHidden,
        specialEvent: !!dg.dungeon.specialEvent,
        breakthrough: !!dg.dungeon.breakthrough,
        lore: dg.dungeon.lore || '',
        enemies: dg.dungeon.enemies || [],
        bosses: dg.dungeon.bosses || [],
        stage: stageKey,
        stageLabel: (dg.plan[dg.planIdx] || {}).label || stageKey,
        roll: null, mod: null, total: null, actor: actor.name,
         support: support ? support.name : null, support2: support2 ? support2.name : null, attr: '',
         needsCheck: !!((dg.plan[dg.planIdx] || {}).check),
         focus: { actor: actor.name, step: focus.focusStep, size: focus.windowSize, highlight: !!focus.highlight, mode: focus.mode },
         allowedCharacters, forbiddenCharacters,
        stepNo: dg.totalStep + 1,
        totalSteps: dg.plan.reduce((a, p) => a + p.steps, 0),
        enemy: dg._curEnemy ? { name: dg._curEnemy.name, realm: dg._curEnemy.realm || '', desc: dg._curEnemy.desc || '' } : null,
        itemUse: null,
        availableItems: availableItemsForActor(dg, actor),
        ownedItems: collectClientOwnedItems(dg),
        skillUse: null,
        party: dg.party.map(m => ({
          name: m.name, gender: m.gender || '男', realm: m.character_class || '', root: (m.traits && m.traits[0]) || '',
          personality: m.personality || '', traits: m.traits || [],
          skills: (m.skills || []).map(s => ({ name: s.name, type: s.type || '', tier: skillTier(s), desc: s.desc || '' })),
          equipment: (m.equipment || []).map(i => ({ name: i.name, kind: i.kind || 'misc', desc: i.desc || '', qty: i.qty || 1, ownerId: m.id, ownerName: m.name || '' })),
          bag: (m.bag || []).map(i => ({ name: i.name, kind: i.kind || 'misc', desc: i.desc || '', qty: i.qty || 1, ownerId: m.id, ownerName: m.name || '' })),
          items: [...(m.equipment || []), ...(m.bag || [])].map(i => ({ name: i.name, kind: i.kind || 'misc', desc: i.desc || '', qty: i.qty || 1, ownerId: m.id, ownerName: m.name || '' })),
        })),
        context: dg.steps.slice(-5).map(s => s.text).join('\n'),
      }),
    });
    const j = await r.json();
    if (j && j.text) {
      const step = normalizeAiStepResult(j, (dg.plan[dg.planIdx] || {}).check ? 'mid' : 'good');
      return { text: String(j.text), src: 'ai', outcome: step.outcome, damage: step.damage, heal: step.heal, itemUse: step.itemUse, skillUse: step.skillUse, loot: step.loot };
    }
    throw new Error('服务器返回异常：' + (j.error || 'AI 返回空内容'));
  } catch (e) {
    // 不再使用本地叙事文本：AI 连接失败由上层取消本次探险（标注失败）
    if (e && e.name === 'AbortError') throw new Error('AI 生成超时（150 秒无响应）');
    throw new Error('AI 生成失败：' + (e && e.message ? e.message : e));
  } finally {
    clearTimeout(timer);
  }
}

/* ---------- 阶段效果（记录每名成员的 AI 战损与收获） ---------- */
function applyStageEffects(dg, stageKey, actor, attrKey, roll, mod, total, outcome, aiDamage, aiHeal = 0, healAllowed = false) {
  const g = dg.memberGains[actor.id];
  const dmg = Number.isFinite(Number(aiDamage)) ? Math.max(0, Math.round(Number(aiDamage))) : 0;
  if (dmg > 0) {
    actor.hp = Math.max(0, (actor.hp || 0) - dmg);
    dg.damage += dmg;
    if (g) g.damage += dmg;
    if (actor.hp <= 0 && !actor.isDead) {
      actor.isDead = true;
      dg.deaths = dg.deaths || [];
      dg.deaths.push(actor.name);
    }
  }
  const heal = Number.isFinite(Number(aiHeal)) ? Math.max(0, Math.round(Number(aiHeal))) : 0;
  if (healAllowed && heal > 0 && actor.hp > 0 && !actor.isDead) {
    const beforeHp = Math.max(0, Number(actor.hp) || 0);
    const maxHp = Math.max(0, Number(actor.max_hp) || 100);
    const actualHeal = Math.max(0, Math.min(maxHp, beforeHp + heal) - beforeHp);
    actor.hp = beforeHp + actualHeal;
    dg.healing = (dg.healing || 0) + actualHeal;
    if (g) g.healing = (g.healing || 0) + actualHeal;
  }
  if (stageKey === 'boss' && (outcome === 'crit' || outcome === 'good')) {
    // 首领战：胜利掉落首领专属战利品，是否受伤完全由 AI damage 决定
    const boss = dg._curEnemy;
    if (boss && boss.reward && !dg.bossDrops.some(r => r.name === boss.reward.name)) dg.bossDrops.push(boss.reward);
  }
}

  if (!role.traits) role.traits = [];

/* ---------- 重伤体系 ----------
   结算时玩家气血 <= 10% 才进入重伤候选，由 AI 低频判断是否添加受伤特质。
   特质带现实时间 3 小时倒计时（role.injury = { name, desc, expiresAt }），
   到期自动移除（角色自身 traits 里同名特质一并清除）。 */
const INJURY_DURATION_MS = 3 * 3600 * 1000;
function addInjury(role, name, desc) {
  if (!role) return;
  role.injury = { name, desc, expiresAt: Date.now() + INJURY_DURATION_MS };
  if (!role.traits) role.traits = [];
  if (!role.traits.includes(name)) role.traits.push(name);
  if (!role.traitDescs) role.traitDescs = {};
  role.traitDescs[name] = desc;
}
function clearExpiredInjury(role) {
  if (!role || !role.injury) return false;
  if (role.injury.expiresAt > Date.now()) return false;
  const injuryName = role.injury.name;
  if (Array.isArray(role.traits)) {
    role.traits = role.traits.filter(name => name !== injuryName);
  }
  if (role.traitDescs && typeof role.traitDescs === 'object') delete role.traitDescs[injuryName];
  role.injury = null;
  return true;
}

  const events = [];
  const seen = new Set();
  const re = /(?:(\d{1,6}|[零〇一二两三四五六七八九十百千万]+)\s*(?:块|枚|颗|个)?\s*(?:下品|中品|上品)?\s*灵石|灵石\s*[：:×xX*]?\s*(\d{1,6}|[零〇一二两三四五六七八九十百千万]+))/g;
  let match;
  while ((match = re.exec(source))) {
    const raw = match[1] || match[2];
    const amount = /^\d+$/.test(raw) ? Number(raw) : cnNumToInt(raw);
    if (!Number.isFinite(amount) || amount <= 0) continue;
    const context = source.slice(Math.max(0, match.index - 90), Math.min(source.length, match.index + match[0].length + 40));
    if (!/(获得|得到|捡|拾|取|拿|收|酬|赐|奖励|报酬|赏|内有|裹着|袋囊|储囊|搜刮|发现|翻出|得了|得)/.test(context)) continue;
    const key = `${match.index}|${amount}|${context.replace(/\s+/g, '')}`;
    if (seen.has(key)) continue;
    seen.add(key);
    events.push({ amount, text: match[0] });
  }
  return events;
}
function extractGold(text) {
  return extractGoldEvents(text).reduce((sum, event) => sum + event.amount, 0);
}
function splitGoldForParty(total, party) {
  const members = Array.isArray(party) ? party.filter(member => member && member.id !== undefined && member.id !== null) : [];
  const amount = Math.max(0, Math.floor(Number(total) || 0));
  if (!members.length) return {};
  const base = Math.floor(amount / members.length);
  const remainder = amount % members.length;
  return Object.fromEntries(members.map((member, index) => [member.id, base + (index < remainder ? 1 : 0)]));
}
/* 从 AI 文本中解析战利品标记【获得：道具名1、道具名2】，支持自由发挥的道具名 */
function parseLootMarkers(text) {
  const names = [];
  const re = /【获得：([^】]+)】/g;
  let m;
  while ((m = re.exec(text || ''))) {
    m[1].split(/[、,，\s]+/).forEach(n => {
      n = n.trim().replace(/[。！？!?]$/, '');
      if (LootSettlement.isValidLootName(n) && !names.includes(n)) names.push(n);
    });
  }
  return names.slice(0, 3);  // 每步最多 3 件
}
/* 调用 AI 为每件新道具编写描述；失败直接中止结算，不生成本地描述 */

/* 结算时由 AI 从整篇文本语义提取战利品；失败中止结算，不回退标记或掉落表 */

/* 特质入角色：traits 存名字，traitDescs 存描述（旧特质无描述） */
function addTraitWithDesc(role, t) {
  if (!role.traits) role.traits = [];
  if (!role.traits.includes(t.name)) role.traits.push(t.name);
  if (t.desc) {
    if (!role.traitDescs) role.traitDescs = {};
    role.traitDescs[t.name] = t.desc;
  }
}

/* 取消本次探险：退还精力、标注失败、写入日志（不伪造本地剧情） */
async function cancelDungeon(dg, reason, errDetail) {
  const role = dg.party[0];
  if (role && ((role.hp || 0) <= 0 || role.isDead)) {
    const deathLog = await finishRoleDeath(dg, role);
    switchTab('mine');
    showDeathDialog(role.name, dg.dungeon.name, deathLog.id, deathLog.death_summary);
    return;
  }
  const idx = activeDungeons.indexOf(dg);
  if (idx >= 0) activeDungeons.splice(idx, 1);
  if (dg.timer) { clearTimeout(dg.timer); dg.timer = null; }
  if (role) {
    role.status = 'resting';
    role.stamina = Math.min(role.max_stamina || 100, (role.stamina || 0) + 10);  // 退还本次探险精力（进入消耗 10）
    role.hpTs = Date.now();  // 取消探险：气血从此刻起重新计时回复
    saveRole();
  }
  const log = {
    id: dg.logNumber || nextLogId(), party_name: '匹配小队_' + dg.id, dungeon_name: dg.dungeon.name,
    status: 'failed', result_summary: '', created_at: new Date().toISOString(), is_favorited: false,
    special_event_theme: '', items_used: [], cancel_reason: errDetail || 'AI 生成失败', summary_text: '',
    dg_snapshot: { icon: dg.dungeon.icon, name: dg.dungeon.name, baseName: dg.dungeon.baseName, isHidden: !!dg.dungeon.isHidden, desc: dg.dungeon.desc, steps: dg.steps, party: dg.party.map(m => ({ name: m.name, is_mine: !!m.is_mine })) },
    settlement: null,
  };
  D.logs.unshift(log);
  saveLogs();
  saveRuns();  // 清理已取消副本的持久化快照
  logViewId = logKey(log);
  toastMsg('⚠️ AI 生成失败，已重试仍未得到有效内容，本次探险已取消');
  switchTab('logs');
}

/* 气血归零：永久删除角色、保留死亡日志并回到创建角色界面 */
async function finishRoleDeath(dg, role) {
  const myGains = dg.memberGains[role.id] || { acts: 0, rolls: [], damage: 0, loot: [], traits: [], crits: 0, fumbles: 0 };
  const fullText = dg.steps.map(s => s.text || s.rawText || '').join('');
  const storyText = LootSettlement.formatStorySteps(dg.steps);
  const deadNames = dg.party.filter(m => (m.hp || 0) <= 0 || m.isDead).map(m => m.name).filter(Boolean);
  let deathSummary;
  try {
    deathSummary = await aiDeathSummary(storyText, dg.dungeon.name, deadNames);
  } catch (e) {
    console.warn('[dungeon] AI 死亡总结失败，使用保底文案：', e && e.message ? e.message : e);
    deathSummary = fallbackDeathSummaryLocal(deadNames, dg.dungeon.name);
  }
  const deathReasonByName = new Map((deathSummary.roles || []).map(entry => [String(entry.name || '').trim(), String(entry.reason || '').trim().slice(0, 100)]));
  const members = dg.party.map(m => {
    const mg = dg.memberGains[m.id] || { acts: 0, rolls: [], damage: 0, loot: [], traits: [], crits: 0, fumbles: 0 };
    return {
      name: m.name, is_mine: !!m.is_mine, realm: m.character_class, acts: mg.acts, rolls: mg.rolls,
      damage: mg.damage, score: 0, gold: 0, loot: [], crits: mg.crits, fumbles: mg.fumbles,
      fate: (m.hp || 0) <= 0 ? '阵亡' : '健康', death_reason: (m.hp || 0) <= 0 ? (deathReasonByName.get(m.name) || fallbackDeathSummaryLocal([m.name], dg.dungeon.name).roles[0].reason) : '', statBuffs: [], newTraits: [], praise: 0,
    };
  });
  const deathLog = {
    id: dg.logNumber || nextLogId(), party_name: '匹配小队_' + dg.id, dungeon_name: dg.dungeon.name, status: 'failed',
    result_summary: fullText || storyText || `${role.name}在${dg.dungeon.name}中气血耗尽，道消身殒。`,
    created_at: new Date().toISOString(), is_favorited: false,
    special_event_theme: dg.dungeon.specialEvent ? '特殊事件' : '', items_used: [],
    death: true, death_role: role.name,
    summary_text: '', death_summary: deathSummary.overall,
    dg_snapshot: { icon: dg.dungeon.icon, name: dg.dungeon.name, baseName: dg.dungeon.baseName, isHidden: !!dg.dungeon.isHidden, specialEvent: !!dg.dungeon.specialEvent, desc: dg.dungeon.desc, steps: dg.steps, party: dg.party.map(m => ({ name: m.name, is_mine: !!m.is_mine })) },
    settlement: { exp: 0, items: [], traits: [], damage: myGains.damage, levelUp: [], members, consumed: [] },
  };
  D.logs.unshift(deathLog);
  saveLogs();
  if (dg.timer) { clearTimeout(dg.timer); dg.timer = null; }
  const dgIdx = activeDungeons.indexOf(dg);
  if (dgIdx >= 0) activeDungeons.splice(dgIdx, 1);
  saveRuns();
  localStorage.removeItem('xiuxian_role');
  D.adventurers = [];
  D.my_adventurer = null;
  renderMine();
  renderAdventurers();
  renderParty();
  renderLogs();
  return deathLog;
}

/* ---------- 结算 ---------- */
async function settleDungeon(dg) {
  const role = dg.party[0];
  if ((role.hp || 0) <= 0 || role.isDead) {
    const deathLog = await finishRoleDeath(dg, role);
    switchTab('mine');
    showDeathDialog(role.name, dg.dungeon.name, deathLog.id, deathLog.death_summary);
    return;
  }
  // 注意：结算期间不移除 activeDungeons（快照保留副本），结算完成后才移除——
  // 否则结算 AI 调用途中页面关闭会丢失副本，无法恢复
  dg.status = 'settling';
  const rolls = dg.steps.filter(s => s.total).map(s => s.total);
  const avg = rolls.length ? rolls.reduce((a, b) => a + b, 0) / rolls.length : 10;
  const myGains = dg.memberGains[role.id] || { acts: 0, rolls: [], damage: 0, loot: [], traits: [], crits: 0, fumbles: 0 };
  const exp = Math.max(15, Math.round(30 + (avg - 10) * 3 + myGains.loot.length * 12));
  const expMul = dg.dungeon.specialEvent ? 1.5 : 1;  // 特殊事件：经验 +50%
  const expFinal = Math.round(exp * expMul);
  const storyText = LootSettlement.formatStorySteps(dg.steps);
  const spiritStoneEvents = extractGoldEvents(storyText);
  const totalSpiritStones = extractGold(storyText);
  const spiritStoneShares = splitGoldForParty(totalSpiritStones, dg.party);
  // 玩家实际收获：剧情文本中提到的副本战利品 → 生成对应道具（每件都配 AI 描述）
  const gainedItems = [];
  const allLoot = [];
  // 剧情战利品：一切以 AI 从全文语义提取的明确获得动作为准，不读取静态掉落表或本地标记回退。
  let extractedLoot;
  try {
    extractedLoot = await aiExtractLoot(storyText);
  } catch (e) {
    console.warn('[dungeon] AI 战利品提取失败，取消探险:', e && e.message ? e.message : e);
    cancelDungeon(dg, '', e && e.message ? e.message : e);
    return;
  }
  const storyLoot = LootSettlement.normalizeLootItems(extractedLoot);
  allLoot.push(...storyLoot);
  // 并行：探险总结 + AI 成败判定；成长、特质与卷轴由同一判定一并决定
  const deadNames = dg.party.filter(m => (m.hp || 0) <= 0 || m.isDead).map(m => m.name).filter(Boolean);
  let summaryText, aiVerdict, deathSummary, scrollItem;
  try {
    [summaryText, aiVerdict, deathSummary] = await Promise.all([
      aiSummary(storyText, dg.dungeon.name),
      aiOutcome(storyText, dg.party),
      deadNames.length ? aiDeathSummary(storyText, dg.dungeon.name, deadNames).catch(error => {
        console.warn('[dungeon] AI 死亡总结失败，使用保底文案：', error && error.message ? error.message : error);
        return fallbackDeathSummaryLocal(deadNames, dg.dungeon.name);
      }) : Promise.resolve({ overall: '', roles: [] }),
    ]);
    const scrollType = aiVerdict.scroll && (aiVerdict.scroll.type === '术法' ? '术法' : '功法');
    if (scrollType) scrollItem = await aiScroll(scrollType);
  } catch (e) {
    console.warn('[dungeon] AI 结算失败，取消探险:', e && e.message ? e.message : e);
    cancelDungeon(dg, '', e && e.message ? e.message : e);
    return;
  }
  // 特质发放结果全部来自 AI 判定
  const newTraits = [];  // 结算 traits（字符串，供结算面板/弹窗显示）
  const traitMap = {};  // memberId -> { name, desc }
  const traitByMember = new Map();
  (Array.isArray(aiVerdict.traits) ? aiVerdict.traits : []).forEach(entry => {
    const memberName = String(entry && entry.member || '').trim();
    const name = String(entry && entry.name || '').trim().slice(0, 12);
    if (memberName && name) traitByMember.set(memberName, { name, desc: String(entry && entry.desc || '').trim().slice(0, 60) });
  });
  dg.party.forEach(m => {
    const t = traitByMember.get(m.name);
    if (!t) return;
    if (m.is_mine) {
      if (!(role.traits || []).includes(t.name)) {
        addTraitWithDesc(role, t);
        newTraits.push(t.name);
      }
    } else {
      addTraitWithDesc(m, t);
    }
    traitMap[m.id] = t;
  });
  if (scrollItem) allLoot.push({ ...scrollItem, qty: 1, rarity: 'rare' });
  // ===== 按功劳分配战利品：每位成员按贡献权重获得道具（为多人游戏做准备，每人收获独立入账） =====
  const meritScores = dg.party.map(m => {
    const g = dg.memberGains[m.id] || { acts: 0, rolls: [], damage: 0, loot: [], traits: [], crits: 0, fumbles: 0 };
    const avgR = g.rolls.length ? g.rolls.reduce((a, b) => a + b, 0) / g.rolls.length : 10;
    const merit = Math.max(1, (g.acts || 0) + (avgR - 10) * 0.4 + (g.crits || 0) * 2 - (g.fumbles || 0) * 1.5 + (g.damage || 0) / 30);
    return { m, g, merit };
  });
  const lootAssign = LootSettlement.assignLoot(allLoot, meritScores.map(x => ({
    id: x.m.id,
    name: x.m.name,
    merit: x.merit,
  })));
  const lootAudit = LootSettlement.buildLootAudit(lootAssign);
  (lootAssign[role.id] || []).forEach(it => {
    if (bagAdd(role, { name: it.name, desc: it.desc || '', qty: it.qty || 1, rarity: it.rarity })) gainedItems.push(it);
    else role.gold = (role.gold || 0) + 5;
  });
  // 结算扣除剧情中使用掉的消耗品（丹药/符箓）：从储物袋或随身法宝中扣 1 个
  const consumed = [];
  (dg.consumed || []).forEach(c => {
    if (c.ownerId !== role.id) return; // 只扣玩家自己的
    let found = null, list = null;
    found = (role.bag || []).find(i => i.name === c.name);
    if (found) list = role.bag; else { found = (role.equipment || []).find(i => i.name === c.name); if (found) list = role.equipment; }
    if (found && list) {
      found.qty = (found.qty || 1) - 1;
      consumed.push({ name: c.name, rarity: c.rarity || 'common' });
      if (found.qty <= 0) {
        const idx = list.indexOf(found);
        if (idx >= 0) list.splice(idx, 1);
      }
    }
  });
  const levelUp = [];
  applyLocalExperience(role, expFinal).forEach(level => {
    role.character_class = realmForLevel(level);
    levelUp.push(role.character_class);
  });
  // 突破成功：练气十层 → 筑基前期
  if (dg.breakthrough && dg.breachSuccess && role.level === 10) {
    role.level = 11;
    role.exp = 0;
    applyLocalLevelGrowth(role, true);
    role.character_class = realmForLevel(role.level);  // 筑基前期
    levelUp.push('筑基前期');
    // 突破流水
    addFeed('⚡', role.name, '突破筑基前期', '突破成功 · 筑基前期', '#f0883e');
  }

    let memberNewTraits = [];

function realmForLevel(lv) {
  if (lv <= 10) return '练气' + (lv === 1 ? '一层' : ['二', '三', '四', '五', '六', '七', '八', '九', '十'][lv - 2] + '层');
  if (lv === 11) return '筑基前期';
  if (lv === 12) return '筑基中期';
  if (lv === 13) return '筑基后期';
  return '筑基圆满';
}
function applyLocalLevelGrowth(role, breakthrough = false) {
  const before = Number(role.max_hp || 100);
  role.max_hp = breakthrough ? Math.round(before * 1.5) : before + (role.level <= 10 ? 20 + Math.floor(Math.random() * 11) : 30 + Math.floor(Math.random() * 21));
  const points = breakthrough ? 20 : role.level <= 10 ? 5 : 10;
  const fields = ['strength', 'agility', 'intelligence', 'luck'];
  for (let i = 0; i < points; i++) {
    const field = fields[Math.floor(Math.random() * fields.length)];
    role[field] = Number(role[field] || 0) + 1;
  }
  role.hp = role.max_hp;
}
function applyLocalExperience(role, amount) {
  role.exp = Number(role.exp || 0) + Number(amount || 0);
  const levels = [];
  while (true) {
    const level = Number(role.level || 1);
    if (level === 10) break;
    if (level >= 14) { role.exp = 2800; break; }
    const threshold = level < 10 ? level * 100 : level * 200;
    if (role.exp < threshold) break;
    role.exp -= threshold;
    role.level = level + 1;
    applyLocalLevelGrowth(role);
    levels.push(role.level);
  }
  return levels;
}

      <div class="log-list adv-log-list">
        ${runs.map(runningRowHTML).join('')}
        ${pageLogs.length ? pageLogs.map(logRowHTML).join('') : `<div class="empty">${logs.length === 0 && !runs.length ? '该角色尚未参与任何探险<br><br>去小队页匹配一局，AI 将根据携带的装备道具实时生成副本剧情' : '没有匹配的探险日志'}</div>`}
      </div>
      ${pages > 1 ? `<div class="log-pager">${advLogPagerHTML(advLogPage, pages)}</div>` : ''}
    </div>`;
  showModal();
}
function advLogsGoPage(p) { advLogPage = Math.max(1, p); renderAdvLogsModal(); }
function advLogPagerHTML(cur, total) {
  const btns = [];
  const add = p => btns.push(p === cur ? `<span class="page-btn cur">${p}</span>` : `<button class="page-btn" onclick="advLogsGoPage(${p})">${p}</button>`);
  const addDots = () => btns.push('<span class="page-dots">…</span>');
  add(1);
  if (total > 1) {
    const lo = Math.max(2, cur - 2), hi = Math.min(total - 1, cur + 2);
    if (lo > 2) addDots();
    for (let p = lo; p <= hi; p++) add(p);
    if (hi < total - 1) addDots();
    add(total);
  }
  btns.unshift(cur > 1 ? `<button class="page-btn" onclick="advLogsGoPage(${cur - 1})">‹</button>` : '<span class="page-btn off">‹</span>');
  btns.push(cur < total ? `<button class="page-btn" onclick="advLogsGoPage(${cur + 1})">›</button>` : '<span class="page-btn off">›</span>');
  return btns.join('');
}
function advTabProfile(adv) {
  const hpPct = adv.max_hp ? Math.max(0, adv.hp / adv.max_hp * 100) : 0;
  const stPct = adv.max_stamina ? Math.max(0, adv.stamina / adv.max_stamina * 100) : 0;

  const expPct2 = expNeed2 ? Math.min(100, Math.max(0, expPatched / expNeed2 * 100)) : 0;
