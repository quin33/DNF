  <div class="adv-stamina" style="margin-bottom:8px"><div class="adv-stamina-fill" style="width:${stPct}%"></div><span class="adv-stamina-text">💪 ${adv.stamina}/${adv.max_stamina} 精力</span></div>

      <div class="stat-box"><div class="k">灵根</div><div class="v" style="font-size:13px">${esc((adv.traits && adv.traits[0]) || '-')}</div></div>
      <div class="stat-box"><div class="k">性格</div><div class="v" style="font-size:13px">${esc(adv.personality || '-')}</div></div>
      <div class="stat-box"><div class="k">灵石</div><div class="v" style="font-size:13px">${Number(adv.gold || 0).toFixed(0)}</div></div>

    <div class="skill-pool-list">
      ${(adv.skills || []).length
        ? (adv.skills || []).map((sk, i) => skillListItemHTML(sk, adv.is_mine ? `<button class="btn btn-sm" onclick="unequipSkill(${i})">卸下</button>` : '')).join('')
        : `<div class="skill-pool-item"><span class="skill-desc">未装备功法 / 术法</span></div>`}
    </div>
    ${adv.is_mine && pool.length ? `<h4 style="margin-top:12px">功法库（${pool.length}）</h4>
    <div class="skill-pool-list">
      ${poolVisible.map((sk, pi) => skillListItemHTML(sk, adv.is_mine ? `<button class="btn btn-sm" onclick="equipSkill(${pi})" ${(adv.skills || []).length >= MAX_SKILLS ? 'disabled' : ''}>装备</button>` : '')).join('')}
    </div>

    ${adv.is_mine ? `<div class="skill-hint">功法库中的功法不参与探险，装备后方可施展；卸下后仍保留在功法库。</div>` : ''}
  </div>

function advTabCombat(adv) {
  // —— 随身法宝：纵向卡片，名称 + 稀有度 + 描述 + 卸下 ——
  const eq = (adv.equipment || []);
  let html = `<div class="ad-sec-title">随身法宝（${eq.length} / 5）</div>`;
  html += eq.length ? `<div class="skill-pool-list">
    ${eq.map((e, i) => itemCardHTML(e, adv.is_mine ? `<button class="btn btn-sm" onclick="unequipToBag(${i})">卸下</button>` : '')).join('')}
  </div>` : '<div class="ad-empty">暂无随身法宝</div>';
  // —— 储物袋：进度 + 筛选 + 排序 + 纵向卡片；仅本人可见 ——
  if (adv.is_mine) {
    const bag = (adv.bag || []);
    const counts = { all: bag.length, common: 0, rare: 0, epic: 0, legendary: 0 };
    bag.forEach(i => { const r = i.rarity || 'common'; if (counts[r] !== undefined) counts[r]++; });
    let list = bag.map((it, idx) => ({ it, idx }));
    if (advBagFilter !== 'all') list = list.filter(x => (x.it.rarity || 'common') === advBagFilter);
    if (advBagSort === 'rarity') {
      const order = { legendary: 0, epic: 1, rare: 2, common: 3 };
      list.sort((a, b) => (order[a.it.rarity || 'common'] || 9) - (order[b.it.rarity || 'common'] || 9));
    } else if (advBagSort === 'name') {
      list.sort((a, b) => (a.it.name || '').localeCompare(b.it.name || '', 'zh'));
    }
    const bagList = advBagExpanded ? list : list.slice(0, 5);
    const chip = (f, label) => `<button class="bchip ${advBagFilter === f ? 'active' : ''}" onclick="setBagFilter('${f}')">${label} ${counts[f] || 0}</button>`;
    html += `<div class="ad-sec-title">储物袋（${bag.length} / 100）</div>
    <div class="bag-toolbar">
      <div class="bag-chips">
        ${chip('all', '全部')}${chip('common', '普通')}${chip('rare', '稀有')}${chip('epic', '珍贵')}${chip('legendary', '传说')}
      </div>
      <select class="bag-sort" onchange="setBagSort(this.value)">
        <option value="default" ${advBagSort === 'default' ? 'selected' : ''}>默认顺序</option>
        <option value="rarity" ${advBagSort === 'rarity' ? 'selected' : ''}>按稀有度</option>
        <option value="name" ${advBagSort === 'name' ? 'selected' : ''}>按名称</option>
      </select>
    </div>`;
    html += bagList.length ? `<div class="skill-pool-list">
      ${bagList.map(({ it, idx }) => itemCardHTML(it, adv.is_mine ? `<button class="btn btn-sm" onclick="equipFromBag(${idx})">装备</button>` : '')).join('')}
    </div>
    ${list.length > 5 ? `<div class="list-expand-row"><button class="btn btn-sm" onclick="toggleAdvBagExpand()">${advBagExpanded ? '收起' : `展开全部（${list.length}）`}</button></div>` : ''}` : '<div class="ad-empty">储物袋空空如也</div>';
  }
  return html;
}

        <span class="rarity-tag" style="color:${RARITY_COLOR[i.rarity || 'common']};border-color:${RARITY_COLOR[i.rarity || 'common']}">${RARITY_NAME[i.rarity || 'common'] || i.rarity}</span>

  </div>` : ''}`;
}
function advTabBio(adv) {
  // 传记：探险履历统计
  const logs = (D.logs || []).filter(l => l.settlement && l.dg_snapshot && l.dg_snapshot.party && l.dg_snapshot.party.some(m => m.name === adv.name));
  const done = logs.filter(l => l.status === 'completed');

  const totalItems = logs.reduce((a, l) => a + (l.settlement ? (Number.isFinite(l.settlement.itemCount) ? l.settlement.itemCount : (Array.isArray(l.settlement.items) ? l.settlement.items.length : 0)) : 0), 0);
  const bioText = String(adv.bio || adv.biography || '').trim();

  <div class="modal-section">
    <h4>探险履历</h4>

        <span class="log-status st-${esc(l.status || '')}">${esc({ completed: '已完成', failed: '失败', in_progress: '进行中', generating: '生成中' }[l.status] || l.status || '')}</span>
        <span class="bio-time">${fmtTimeFull(l.created_at)}</span>
      </div>`).join('')}</div>` : '<div class="ad-empty">尚无探险记录，去小队页匹配一局吧</div>'}
  </div>`;
}
function showModal() { $('#modal-overlay').classList.add('show'); }

function toggleFollow(btn, id) {

/* ============================================================
   标签切换
   ============================================================ */
const renderers = {
  tavern: renderTavern,
  activity: renderActivity,
  building: renderBuilding,
  mine: renderMine,
  adventurers: renderAdventurers,
  party: renderParty,
  logs: renderLogs,
};
function switchTab(tab) {
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $$('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + tab));
  try { sessionStorage.setItem('xiuxian_active_tab', tab); } catch (_) {}
  const renderer = tab === 'party' && typeof window.renderParty === 'function' ? window.renderParty : renderers[tab];
  (renderer || (() => {}))();
  void window.loadTabData?.(tab);
}
$$('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

/* 初始渲染 + hash 直达（如 #mine / #adventurers） */
window.__onlineRoleLoading = !!localStorage.getItem('xiuxian_online_token');
let savedTab = '';
try { savedTab = sessionStorage.getItem('xiuxian_active_tab') || ''; } catch (_) {}
const hashTab = (location.hash || '').replace('#', '');
const initTab = renderers[hashTab] ? hashTab : (renderers[savedTab] ? savedTab : 'mine');
switchTab(renderers[initTab] ? initTab : 'tavern');
bindChatInput();
// 延迟到 DOMContentLoaded：届时 online.js 已覆盖 restoreRuns（在线模式 no-op），单机模式仍恢复
window.addEventListener('DOMContentLoaded', () => {
  try { window.restoreRuns && window.restoreRuns(); } catch (e) {}
});
window.addEventListener('pagehide', () => { pageClosing = true; saveRuns(); });  // 关闭/刷新前最后落盘一次
window.addEventListener('hashchange', () => {
  const t = (location.hash || '').replace('#', '');
  if (renderers[t]) switchTab(t);
});

/* ---------- 重伤倒计时：每秒刷新 .injury-cd 徽章，到期自动清除受伤特质 ---------- */
function injuryTick() {
  let expired = false;
  document.querySelectorAll('.injury-cd').forEach(el => {
    const exp = Number(el.dataset.expires || 0);
    const left = exp - Date.now();
    if (left <= 0) { el.textContent = '已恢复'; expired = true; return; }
    const h = Math.floor(left / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    const s = Math.floor((left % 60000) / 1000);
    el.textContent = `⏳ ${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  });
  if (expired) {
    [D.my_adventurer, ...(D.adventurers || [])].forEach(r => {
      if (r && clearExpiredInjury(r)) toastMsg(`「${r.name}」伤势已恢复，受伤特质消失`);
    });
    if (!window.__onlineMode) saveRole();
    renderMine(); renderAdventurers(); renderTavern(); renderParty(); renderLogs();
  }
}
setInterval(injuryTick, 1000);
